name: Build Neurotrânsito Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/neurotransito-android-apk
    paths:
      - 'android-app/**'
      - '.github/workflows/build-neurotransito-release-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cmnt-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cmnt-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found at $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload signed APK for review
        uses: actions/upload-artifact@v4
        with:
          name: neurotransito-android-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
