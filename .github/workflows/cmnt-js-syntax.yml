name: CMNT JS Syntax Check
concurrency:
  group: enat-editorial-phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: ["feature/cmnt-neurocientifico"]
  push:
    branches: ["feature/cmnt-neurocientifico"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check editorial.js
          node --check cmnt-platform.js
          node --check cmnt-scientific.js
          node --check cmnt-observatory.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          Path("/tmp/cmnt-index-scripts.js").write_text("\n\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cmnt-index-scripts.js

  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the server worker and adapters
        run: deno check supabase/functions/enat-publication-worker/index.ts supabase/functions/enat-publication-worker/adapters/adapters_test.ts
      - name: Test social adapters with mocked provider responses
        run: deno test --allow-env=META_GRAPH_API_VERSION,LINKEDIN_API_VERSION supabase/functions/enat-publication-worker/adapters/adapters_test.ts

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        working-directory: tests/editorial-homologation
        run: supabase start -x realtime,storage-api,imgproxy,kong,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,mailpit,supavisor
      - name: Apply isolated editorial migrations to local database
        working-directory: tests/editorial-homologation
        run: supabase db reset --local
      - name: Run editorial pgTAP database tests
        working-directory: tests/editorial-homologation
        run: supabase test db --local
