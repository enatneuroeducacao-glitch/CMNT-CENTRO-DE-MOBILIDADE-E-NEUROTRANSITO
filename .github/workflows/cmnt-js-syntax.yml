name: CMNT JS Syntax Check
on:
  pull_request:
    branches: ["feature/cmnt-neurocientifico"]
  push:
    branches: ["feature/cmnt-neurocientifico"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check editorial.js
          node --check cmnt-platform.js
          node --check cmnt-scientific.js
          node --check cmnt-observatory.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          Path("/tmp/cmnt-index-scripts.js").write_text("\n\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cmnt-index-scripts.js

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,inbucket
      - name: Apply repository migrations to local database
        run: supabase db reset --local
      - name: Run pgTAP database tests
        run: supabase test db --local
