services:
  cmnt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmnt-neurotransito
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
