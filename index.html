<style>
body{background:#f4f7fa;color:#07111f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.brand{background:linear-gradient(135deg,#07111f,#103b5d 60%,#16b86a)}.card{background:#fff;border:1px solid #e8edf2;box-shadow:0 10px 35px rgba(7,17,31,.07)}.glass{background:rgba(255,255,255,.88);backdrop-filter:blur(15px)}.active{background:#e7f7ef;color:#087a49}.hide{display:none!important}.scroll::-webkit-scrollbar{display:none}.scroll{scrollbar-width:none}.modal{background:rgba(0,0,0,.58);backdrop-filter:blur(8px)}button{transition:.15s}button:active{transform:scale(.98)}</style>

<body>
<div id="app"><div style="min-height:100vh;display:grid;place-items:center;background:#f4f7fa;font-family:system-ui,sans-serif"><div style="text-align:center;padding:30px"><div style="font-size:28px;font-weight:900;color:#07111f">CMNT</div><div style="margin-top:10px;color:#64748b">Carregando a rede social...</div></div></div></div><div id="modal"></div><div id="toast" class="fixed right-4 bottom-20 md:bottom-5 z-[90] space-y-2"></div>
<script>
const SUPABASE_URL='https://gicjsuagmiyoqvttbqjw.supabase.co';
const KEY='sb_publishable_ovAAaIT0nXzSMiy2KYGHTw_ydsshEzK';
let db=null;function bootError(e){var a=document.getElementById('app');if(a)a.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#f4f7fa;font-family:system-ui,sans-serif;padding:24px"><div style="max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 10px 35px rgba(7,17,31,.08)"><div style="font-size:28px;font-weight:900;color:#07111f">CMNT</div><h1 style="font-size:22px;margin:16px 0 8px">Não foi possível iniciar a aplicação</h1><p style="color:#64748b;line-height:1.6">A página foi publicada, mas ocorreu um erro ao iniciar a conexão da aplicação. O sistema identificou o problema e pode ser corrigido sem perder os dados.</p><pre style="white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:14px;color:#991b1b;font-size:12px">'+esc(e&&e.message?e.message:String(e))+'</pre><button onclick="location.reload()" style="margin-top:12px;background:#07111f;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700">Tentar novamente</button></div></div>';}try{if(!window.supabase||!window.supabase.createClient)throw new Error('Biblioteca Supabase não carregou.');db=window.supabase.createClient(SUPABASE_URL,KEY);}catch(e){bootError(e);}
const S={tab:'home',user:null,profile:null,posts:[],communities:[],notes:[],following:new Set(),saved:new Set(),likes:new Set(),search:''};

function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function av(p){return p&&p.avatar_url?p.avatar_url:'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent((p&&p.display_name)||'FT')}
function ago(d){var n=(Date.now()-new Date(d).getTime())/1000;if(n<60)return'agora';if(n<3600)return Math.floor(n/60)+' min';if(n<86400)return Math.floor(n/3600)+' h';if(n<604800)return Math.floor(n/86400)+' d';return new Date(d).toLocaleDateString('pt-BR')}
function toast(t,err){var x=document.createElement('div');x.className='px-4 py-3 rounded-2xl text-sm font-bold shadow-xl '+(err?'bg-red-600 text-white':'bg-[#07111f] text-white');x.textContent=t;document.getElementById('toast').appendChild(x);setTimeout(function(){x.remove()},3000)}
function close(){document.getElementById('modal').innerHTML=''}
function svg(n){var d={home:'M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5v-9Z',search:'m21 21-4.4-4.4M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',user:'M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',heart:'M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z',comment:'M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-4.2-1.1L3 20l1.6-4.5A8 8 0 1 1 20 11.5Z',bookmark:'M6 3h12v18l-6-4-6 4V3Z',share:'M12 3v12m0-12 5 5m-5-5L7 8M5 13v6h14v-6',message:'M21 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-4.2-1.1L4 20l1.6-4.5A8 8 0 1 1 21 11.5Z',shield:'M12 3 20 6v5c0 5.5-3.4 9-8 10-4.6-1-8-4.5-8-10V6l8-3Z',settings:'M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z'};return'<svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="'+(d[n]||d.home)+'"/></svg>'}

function nav(){var a=[['home','Início'],['search','Explorar'],['users','Comunidades'],['bell','Notificações'],['message','Mensagens'],['bookmark','Salvos'],['user','Perfil'],['settings','Configurações']];return a.map(function(x){return'<button onclick="go(\''+x[0]+'\')" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-bold '+(S.tab===x[0]?'active':'text-slate-600 hover:bg-slate-50')+'">'+svg(x[0])+'<span>'+x[1]+'</span></button>'}).join('')}
function header(){return'<header class="sticky top-0 z-50 glass border-b border-slate-200"><div class="max-w-7xl mx-auto h-16 px-3 sm:px-5 flex items-center gap-3"><button onclick="go(\'home\')" class="flex items-center gap-2"><span class="w-10 h-10 rounded-2xl brand text-white grid place-items-center font-black">FT</span><span class="hidden sm:block text-xl font-black">CMNT</span></button><div class="hidden md:block flex-1 max-w-lg relative ml-5"><input value="'+esc(S.search)+'" onkeydown="if(event.key===\'Enter\'){S.search=this.value;loadPosts().then(render)}" class="w-full bg-slate-100 rounded-2xl py-2.5 pl-4 pr-4 outline-none" placeholder="Pesquisar trânsito, pessoas e comunidades"></div><div class="ml-auto flex items-center gap-2">'+(S.user?'<button onclick="go(\'notifications\')" class="p-2.5 rounded-xl hover:bg-slate-100">'+svg('bell')+'</button><button onclick="go(\'profile\')" class="flex items-center gap-2 p-1 rounded-2xl"><img src="'+av(S.profile)+'" class="w-9 h-9 rounded-xl"><span class="hidden lg:block text-sm font-bold">'+esc(S.profile.display_name)+'</span></button>':'<button onclick="auth()" class="px-4 py-2.5 bg-[#07111f] text-white rounded-xl font-bold text-sm">Entrar</button>')+'</div></div></header>'}
function rail(){return'<aside class="hidden md:block sticky top-20 h-fit space-y-4"><div class="card rounded-3xl p-5"><div class="flex justify-between items-center"><b>Comunidades</b><button onclick="go(\'users\')" class="text-xs text-[#0b8b55] font-bold">Ver todas</button></div><div class="mt-4 space-y-4">'+S.communities.slice(0,5).map(function(c){return'<button onclick="community(\''+c.id+'\')" class="w-full text-left flex gap-3"><span class="w-10 h-10 rounded-xl brand text-white grid place-items-center font-black">'+esc(c.name).slice(0,2).toUpperCase()+'</span><span><b class="block text-sm">'+esc(c.name)+'</b><small class="text-slate-500">'+esc(c.category)+'</small></span></button>'}).join('')+'</div></div><div class="card rounded-3xl p-5"><b>Manifesto</b><p class="text-sm text-slate-600 mt-2 leading-6">Segurança antes do engajamento. Informação antes do ruído. Pessoas antes dos veículos.</p></div></aside>'}
function shell(){document.getElementById('app').innerHTML=header()+'<div class="max-w-7xl mx-auto grid md:grid-cols-[220px_minmax(0,1fr)_300px] gap-6 px-3 sm:px-5 py-5"><aside class="hidden md:block sticky top-20 h-fit"><div class="card rounded-3xl p-3">'+nav()+'</div><div class="brand text-white rounded-3xl p-5 mt-4"><small class="uppercase tracking-widest text-emerald-300 font-black">CMNT</small><h3 class="font-black text-lg mt-1">Rede social de trânsito</h3><p class="text-white/70 text-sm mt-2">Conectando conhecimento, comportamento e mobilidade.</p></div></aside><main id="main" class="min-w-0"></main>'+rail()+'</div><nav class="md:hidden fixed bottom-0 inset-x-0 z-50 glass border-t px-2 pb-[env(safe-area-inset-bottom)]"><div class="grid grid-cols-5 py-2">'+[['home','Início'],['search','Explorar'],['plus','Criar'],['users','Grupos'],['user','Perfil']].map(function(x){return'<button onclick="go(\''+(x[0]==='plus'?'create':x[0]==='users'?'users':x[0])+'\')" class="flex flex-col items-center gap-1 text-xs '+(S.tab===x[0]?'text-[#0b8b55]':'text-slate-500')+'">'+(x[0]==='plus'?'<span class="w-8 h-8 rounded-xl bg-[#07111f] text-white grid place-items-center text-xl">+</span>':svg(x[0]))+x[1]+'</button>'}).join('')+'</div></nav>';render()}
function composer(){return'<div class="card rounded-3xl p-4"><div class="flex gap-3"><img src="'+av(S.profile)+'" class="w-11 h-11 rounded-2xl"><button onclick="createPost()" class="flex-1 text-left bg-slate-100 text-slate-500 rounded-2xl px-4">O que está acontecendo no trânsito?</button></div><div class="flex justify-between mt-3 pt-3 border-t text-sm"><button onclick="createPost()" class="font-bold text-slate-600">▧ Foto</button><button onclick="createPost()" class="font-bold text-slate-600">▶ Vídeo</button><button onclick="createPost()" class="font-bold text-amber-600">⚠ Alerta</button><button onclick="createPost()" class="font-bold text-[#0b8b55]">Publicar</button></div></div>'}
function post(p){var prof=p.social_profiles||{},like=S.likes.has(p.id),save=S.saved.has(p.id);return'<article class="card rounded-3xl p-4 sm:p-5"><div class="flex gap-3"><img src="'+av(prof)+'" class="w-11 h-11 rounded-2xl"><div class="flex-1 min-w-0"><button onclick="openProfile(\''+p.author_id+'\')" class="font-black">'+esc(prof.display_name||'Usuário')+'</button><div class="text-xs text-slate-500">@'+esc(prof.username||'usuario')+' · '+ago(p.created_at)+(p.location?' · '+esc(p.location):'')+'</div></div><button onclick="report(\''+p.id+'\')" class="text-slate-400">•••</button></div><div class="mt-4 whitespace-pre-wrap leading-7">'+esc(p.content).replace(/#([\wÀ-ÿ-]+)/g,'<b class="text-[#0b8b55]">#$1</b>')+'</div>'+(p.media_url?'<div class="mt-4 rounded-2xl overflow-hidden bg-slate-100">'+(p.media_type==='video'?'<video controls class="w-full max-h-[520px]" src="'+esc(p.media_url)+'"></video>':'<img class="w-full max-h-[520px] object-cover" src="'+esc(p.media_url)+'">')+'</div>':'')+'<div class="flex items-center justify-between mt-4 pt-3 border-t text-slate-500"><button onclick="like(\''+p.id+'\')" class="'+(like?'text-red-500':'')+' flex gap-2 items-center">'+svg('heart')+'Curtir</button><button onclick="comments(\''+p.id+'\')" class="flex gap-2 items-center">'+svg('comment')+'Comentar</button><button onclick="share(\''+p.id+'\')" class="flex gap-2 items-center">'+svg('share')+'Compartilhar</button><button onclick="bookmark(\''+p.id+'\')" class="'+(save?'text-[#0b8b55]':'')+'">'+svg('bookmark')+'</button></div></article>'}
function home(){return'<section><div class="brand text-white rounded-3xl p-6 sm:p-8 mb-5"><small class="uppercase tracking-[.2em] font-black text-emerald-300">CMNT • mobilidade • segurança</small><h1 class="text-3xl sm:text-4xl font-black mt-2">Uma rede social feita para quem vive o trânsito.</h1><p class="mt-3 text-white/75 max-w-2xl">Motoristas, motociclistas, ciclistas, pedestres, instrutores, pesquisadores, gestores e comunidades no mesmo espaço.</p></div>'+composer()+'<div id="feed" class="space-y-4 mt-5"></div></section>'}
function explore(){return'<section><div class="card rounded-3xl p-5"><h1 class="text-3xl font-black">Explorar</h1><p class="text-slate-500 mt-1">Encontre conhecimento, pessoas e conversas sobre mobilidade.</p><div class="flex gap-2 mt-4"><input id="q" value="'+esc(S.search)+'" onkeydown="if(event.key===\'Enter\'){S.search=this.value;loadPosts().then(render)}" class="flex-1 bg-slate-100 rounded-2xl px-4 py-3" placeholder="Buscar"><button onclick="S.search=document.getElementById(\'q\').value;loadPosts().then(render)" class="bg-[#07111f] text-white px-5 rounded-2xl font-bold">Buscar</button></div><div class="flex gap-2 overflow-auto scroll mt-4">'+['Segurança Viária','Legislação','Educação','Mobilidade','Motociclistas','Ciclistas','Pedestres','Infraestrutura'].map(function(x){return'<button onclick="S.search=\''+x+'\';loadPosts().then(render)" class="shrink-0 px-4 py-2 bg-slate-100 rounded-full text-sm font-bold">'+x+'</button>'}).join('')+'</div></div><div id="feed" class="space-y-4 mt-5"></div></section>'}
function communities(){return'<section><div class="flex justify-between items-center mb-5"><div><small class="uppercase tracking-widest text-[#0b8b55] font-black">Comunidades</small><h1 class="text-3xl font-black">Encontre sua comunidade</h1></div><button onclick="newCommunity()" class="bg-[#07111f] text-white px-4 py-3 rounded-2xl font-bold">+ Criar</button></div><div class="grid sm:grid-cols-2 gap-4">'+S.communities.map(function(c){return'<button onclick="community(\''+c.id+'\')" class="card text-left rounded-3xl p-5"><div class="w-14 h-14 brand text-white rounded-2xl grid place-items-center font-black text-xl">'+esc(c.name).slice(0,2).toUpperCase()+'</div><h3 class="font-black text-lg mt-4">'+esc(c.name)+'</h3><p class="text-sm text-slate-500 mt-1">'+esc(c.description)+'</p><small class="text-[#0b8b55] font-bold block mt-4">'+esc(c.category)+'</small></button>'}).join('')+'</div></section>'}
function notes(){return'<section><h1 class="text-3xl font-black mb-5">Notificações</h1><div class="card rounded-3xl divide-y">'+(S.notes.length?S.notes.map(function(n){return'<div class="p-5"><b>'+esc(n.message)+'</b><div class="text-xs text-slate-500 mt-1">'+ago(n.created_at)+'</div></div>'}).join(''):'<div class="p-10 text-center text-slate-500">Nenhuma notificação.</div>')+'</div></section>'}
function messages(){return'<section><h1 class="text-3xl font-black">Mensagens</h1><div class="card rounded-3xl p-10 text-center mt-5"><div class="mx-auto w-16 h-16 rounded-3xl bg-slate-100 grid place-items-center">'+svg('message')+'</div><h2 class="font-black text-xl mt-4">Conversas privadas</h2><p class="text-slate-500 mt-2">A infraestrutura segura de mensagens está pronta para evoluir para conversas individuais e grupos.</p></div></section>'}
function saved(){var x=S.posts.filter(function(p){return S.saved.has(p.id)});return'<section><h1 class="text-3xl font-black mb-5">Salvos</h1><div class="space-y-4">'+(x.length?x.map(post).join(''):'<div class="card rounded-3xl p-10 text-center text-slate-500">Você ainda não salvou publicações.</div>')+'</div></section>'}
function profile(){return'<section><div class="card rounded-3xl overflow-hidden"><div class="h-40 brand"></div><div class="p-5"><div class="-mt-16 flex justify-between items-end"><img src="'+av(S.profile)+'" class="w-28 h-28 rounded-3xl border-4 border-white"><button onclick="editProfile()" class="px-4 py-2.5 bg-slate-100 rounded-xl font-bold">Editar perfil</button></div><h1 class="text-2xl font-black mt-3">'+esc(S.profile.display_name)+'</h1><div class="text-sm text-slate-500">@'+esc(S.profile.username||'usuario')+(S.profile.city?' · '+esc(S.profile.city)+'/'+esc(S.profile.state||''):'')+'</div><p class="mt-3">'+esc(S.profile.bio||'')+'</p><div class="flex gap-6 mt-4 text-sm"><b>'+(S.profile.followers_count||0)+' <span class="font-normal">seguidores</span></b><b>'+(S.profile.following_count||0)+' <span class="font-normal">seguindo</span></b></div></div></div><h2 class="font-black text-xl mt-6 mb-3">Minhas publicações</h2><div id="feed" class="space-y-4"></div></section>'}
function settings(){return'<section><h1 class="text-3xl font-black mb-5">Configurações</h1><div class="card rounded-3xl p-5"><h3 class="font-black">Conta</h3><p class="text-sm text-slate-500 mt-1">'+esc(S.user&&S.user.email)+'</p><button onclick="logout()" class="mt-4 px-4 py-3 bg-red-50 text-red-600 rounded-xl font-bold">Sair</button></div><div class="card rounded-3xl p-5 mt-4"><h3 class="font-black">Código de comunidade</h3><p class="text-sm text-slate-500 mt-2">Não incentivamos direção perigosa, rachas, perseguições, violência ou exposição indevida. Denuncie conteúdo que coloque pessoas em risco.</p></div></section>'}
function render(){var views={home:home,search:explore,users:communities,bell:notes,message:messages,bookmark:saved,profile:profile,settings:settings,create:home};document.getElementById('main').innerHTML=(views[S.tab]||home)();var f=document.getElementById('feed');if(f){var list=S.posts;if(S.tab==='profile')list=list.filter(function(p){return p.author_id===S.user.id});f.innerHTML=list.length?list.map(post).join(''):'<div class="card rounded-3xl p-10 text-center text-slate-500">Nenhuma publicação encontrada.</div>'}}
function go(t){if(t==='create')return createPost();S.tab=t;shell()}
async function loadPosts(){var q=db.from('social_posts').select('id,author_id,content,media_url,media_type,location,visibility,created_at').eq('visibility','public').order('created_at',{ascending:false}).limit(60);if(S.search)q=q.ilike('content','%'+S.search.replace(/[%_]/g,'')+'%');var r=await q;if(r.error){toast('Feed: '+r.error.message,true);S.posts=[];return}S.posts=r.data||[];var ids=[...new Set(S.posts.map(function(p){return p.author_id}).filter(Boolean))];if(ids.length){var pr=await db.from('social_profiles').select('id,username,display_name,avatar_url,city,state,verified').in('id',ids);var map={};(pr.data||[]).forEach(function(x){map[x.id]=x});S.posts.forEach(function(p){p.social_profiles=map[p.author_id]||{display_name:'Usuário',username:'usuario'}})}if(S.user){var l=await db.from('social_reactions').select('post_id').eq('user_id',S.user.id);S.likes=new Set((l.data||[]).map(function(x){return x.post_id}));var b=await db.from('social_bookmarks').select('post_id').eq('user_id',S.user.id);S.saved=new Set((b.data||[]).map(function(x){return x.post_id}))}}
async function load(){var c=await db.from('social_communities').select('*').order('name');S.communities=c.data||[];if(S.user){var n=await db.from('social_notifications').select('*').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(30);S.notes=n.data||[]}await loadPosts()}
function auth(){document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-md"><div class="text-xs uppercase tracking-widest text-[#0b8b55] font-black">CMNT</div><h2 id="at" class="text-2xl font-black mt-1">Entrar</h2><div class="space-y-3 mt-5"><input id="an" class="w-full p-3 bg-slate-100 rounded-xl hide" placeholder="Nome"><input id="ae" type="email" class="w-full p-3 bg-slate-100 rounded-xl" placeholder="E-mail"><input id="ap" type="password" class="w-full p-3 bg-slate-100 rounded-xl" placeholder="Senha"><button id="ab" onclick="doAuth(false)" class="w-full p-3 bg-[#07111f] text-white rounded-xl font-bold">Entrar</button><button onclick="toggleAuth()" class="w-full p-2 text-sm text-[#0b8b55] font-bold">Criar conta</button><button onclick="close()" class="w-full p-2 text-sm text-slate-400">Cancelar</button></div></div></div>'}
var reg=false;function toggleAuth(){reg=!reg;document.getElementById('at').textContent=reg?'Criar conta':'Entrar';document.getElementById('an').classList.toggle('hide',!reg);document.getElementById('ab').textContent=reg?'Cadastrar':'Entrar';document.getElementById('ab').onclick=function(){doAuth(reg)}}
async function doAuth(sign){var e=document.getElementById('ae').value,p=document.getElementById('ap').value,n=document.getElementById('an').value;if(p.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.',true);var r=sign?await db.auth.signUp({email:e,password:p,options:{data:{display_name:n||e.split('@')[0],username:(n||e.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g,'')}}}):await db.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message,true);close();await init()}
async function logout(){await db.auth.signOut();await init()}
function createPost(){if(!S.user)return auth();document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-xl"><div class="flex justify-between"><h2 class="text-2xl font-black">Nova publicação</h2><button onclick="close()" class="text-2xl text-slate-400">×</button></div><textarea id="pc" rows="7" class="w-full bg-slate-100 rounded-2xl p-4 mt-5" placeholder="Compartilhe uma experiência, notícia ou solução sobre trânsito..."></textarea><input id="pm" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="URL de imagem ou vídeo (opcional)"><input id="pl" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Local (opcional)"><button onclick="publish()" class="w-full bg-[#0b8b55] text-white rounded-2xl p-3 mt-4 font-black">Publicar</button></div></div>'}
async function publish(){var c=document.getElementById('pc').value.trim(),m=document.getElementById('pm').value.trim(),l=document.getElementById('pl').value.trim();if(!c)return toast('Escreva o conteúdo.',true);var r=await db.from('social_posts').insert({author_id:S.user.id,content:c,media_url:m||null,media_type:m&&/\.mp4|\.webm|\.mov/i.test(m)?'video':'image',location:l||null});if(r.error)return toast(r.error.message,true);close();await load();S.tab='home';shell();toast('Publicação criada.')}
async function like(id){if(!S.user)return auth();if(S.likes.has(id)){await db.from('social_reactions').delete().eq('post_id',id).eq('user_id',S.user.id);S.likes.delete(id)}else{await db.from('social_reactions').insert({post_id:id,user_id:S.user.id,reaction:'like'});S.likes.add(id)}render()}
async function bookmark(id){if(!S.user)return auth();if(S.saved.has(id)){await db.from('social_bookmarks').delete().eq('post_id',id).eq('user_id',S.user.id);S.saved.delete(id);toast('Removido dos salvos')}else{await db.from('social_bookmarks').insert({post_id:id,user_id:S.user.id});S.saved.add(id);toast('Salvo')}render()}
async function share(id){var u=location.href.split('#')[0]+'#post-'+id;if(navigator.share){navigator.share({title:'CMNT',text:'Veja no CMNT',url:u})}else{navigator.clipboard&&navigator.clipboard.writeText(u);toast('Link copiado.')}}
async function comments(id){var r=await db.from('social_comments').select('id,content,created_at,social_profiles:author_id(display_name,username,avatar_url)').eq('post_id',id).order('created_at');var a=r.data||[];document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] flex items-end md:items-center justify-center"><div class="bg-white w-full md:max-w-xl md:rounded-3xl rounded-t-3xl max-h-[85vh] flex flex-col"><div class="p-5 border-b flex justify-between"><b class="text-xl">Comentários</b><button onclick="close()" class="text-2xl">×</button></div><div class="p-5 overflow-auto flex-1 space-y-4">'+(a.length?a.map(function(x){return'<div class="flex gap-3"><img class="w-9 h-9 rounded-xl" src="'+av(x.social_profiles)+'"><div class="bg-slate-100 rounded-2xl px-4 py-2"><b class="text-sm">'+esc(x.social_profiles&&x.social_profiles.display_name)+'</b><p class="text-sm">'+esc(x.content)+'</p></div></div>'}).join(''):'<div class="text-center text-slate-500 py-10">Nenhum comentário.</div>')+'</div>'+(S.user?'<div class="p-4 border-t flex gap-2"><input id="cc" class="flex-1 bg-slate-100 rounded-2xl px-4" placeholder="Comentar..."><button onclick="commentAdd(\''+id+'\')" class="bg-[#07111f] text-white px-4 rounded-2xl font-bold">Enviar</button></div>':'')+'</div></div>'}
async function commentAdd(id){var c=document.getElementById('cc').value.trim();if(!c)return;await db.from('social_comments').insert({post_id:id,author_id:S.user.id,content:c});comments(id)}
async function report(id){if(!S.user)return auth();var r=prompt('Motivo da denúncia:');if(!r)return;await db.from('social_reports').insert({reporter_id:S.user.id,post_id:id,reason:r});toast('Denúncia registrada.')}
async function openProfile(id){var r=await db.from('social_profiles').select('*').eq('id',id).single();if(!r.data)return;var p=r.data;document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-md"><div class="flex justify-between"><button onclick="close()" class="text-slate-400">Fechar</button>'+(S.user&&S.user.id!==id?'<button onclick="follow(\''+id+'\')" class="bg-[#07111f] text-white px-4 py-2 rounded-xl font-bold">'+(S.following.has(id)?'Seguindo':'Seguir')+'</button>':'')+'</div><div class="text-center mt-4"><img src="'+av(p)+'" class="w-24 h-24 rounded-3xl mx-auto"><h2 class="text-2xl font-black mt-3">'+esc(p.display_name)+'</h2><p class="text-slate-500">@'+esc(p.username)+'</p><p class="mt-3">'+esc(p.bio||'')+'</p></div></div></div>'}
async function follow(id){if(!S.user)return auth();if(S.following.has(id)){await db.from('social_follows').delete().eq('follower_id',S.user.id).eq('following_id',id);S.following.delete(id)}else{await db.from('social_follows').insert({follower_id:S.user.id,following_id:id});S.following.add(id)}openProfile(id)}
function community(id){var c=S.communities.find(function(x){return x.id===id});if(!c)return;document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg"><div class="flex justify-between"><span class="text-xs uppercase tracking-widest text-[#0b8b55] font-black">'+esc(c.category)+'</span><button onclick="close()" class="text-2xl">×</button></div><div class="w-16 h-16 brand text-white rounded-2xl grid place-items-center font-black text-xl mt-5">'+esc(c.name).slice(0,2).toUpperCase()+'</div><h2 class="text-2xl font-black mt-4">'+esc(c.name)+'</h2><p class="text-slate-600 mt-2">'+esc(c.description)+'</p>'+(S.user?'<button onclick="join(\''+id+'\')" class="w-full bg-[#0b8b55] text-white rounded-2xl p-3 mt-5 font-black">Participar</button>':'<button onclick="auth()" class="w-full bg-[#07111f] text-white rounded-2xl p-3 mt-5 font-black">Entrar para participar</button>')+'</div></div>'}
async function join(id){var r=await db.from('social_community_members').upsert({community_id:id,user_id:S.user.id});if(r.error)return toast(r.error.message,true);toast('Você entrou na comunidade.');close()}
function newCommunity(){if(!S.user)return auth();document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg"><h2 class="text-2xl font-black">Criar comunidade</h2><input id="cn" class="w-full bg-slate-100 rounded-xl p-3 mt-5" placeholder="Nome"><input id="ccat" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Categoria"><textarea id="cd" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Descrição"></textarea><button onclick="saveCommunity()" class="w-full bg-[#0b8b55] text-white rounded-xl p-3 mt-4 font-black">Criar</button></div></div>'}
async function saveCommunity(){var n=document.getElementById('cn').value.trim(),cat=document.getElementById('ccat').value.trim()||'Segurança Viária',d=document.getElementById('cd').value.trim();if(!n)return;var slug=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,6);var r=await db.from('social_communities').insert({name:n,slug:slug,description:d,category:cat,created_by:S.user.id});if(r.error)return toast(r.error.message,true);close();await load();shell()}
function editProfile(){if(!S.user)return auth();var p=S.profile;document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg"><h2 class="text-2xl font-black">Editar perfil</h2><input id="pn" class="w-full bg-slate-100 rounded-xl p-3 mt-5" value="'+esc(p.display_name)+'"><input id="pcity" class="w-full bg-slate-100 rounded-xl p-3 mt-3" value="'+esc(p.city||'')+'" placeholder="Cidade"><input id="pst" class="w-full bg-slate-100 rounded-xl p-3 mt-3" value="'+esc(p.state||'')+'" placeholder="UF"><textarea id="pb" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Bio">'+esc(p.bio||'')+'</textarea><button onclick="saveProfile()" class="w-full bg-[#0b8b55] text-white rounded-xl p-3 mt-4 font-black">Salvar</button></div></div>'}
async function saveProfile(){var r=await db.from('social_profiles').update({display_name:document.getElementById('pn').value,city:document.getElementById('pcity').value,state:document.getElementById('pst').value.toUpperCase(),bio:document.getElementById('pb').value,updated_at:new Date().toISOString()}).eq('id',S.user.id).select().single();if(r.error)return toast(r.error.message,true);S.profile=r.data;close();shell()}
async function init(){if(!db)return;try{var s=await db.auth.getSession();S.user=s.data.session?s.data.session.user:null;if(S.user){var p=await db.from('social_profiles').select('*').eq('id',S.user.id).maybeSingle();S.profile=p.data||{display_name:S.user.email.split('@')[0],username:'usuario'};var f=await db.from('social_follows').select('following_id').eq('follower_id',S.user.id);S.following=new Set((f.data||[]).map(function(x){return x.following_id}))}else S.profile={display_name:'Visitante',username:'visitante'};await load();shell()}catch(e){console.error(e);bootError(e)}}
if(db){db.auth.onAuthStateChange(function(){setTimeout(init,0)});init()}
</script>
</body>
</html>
