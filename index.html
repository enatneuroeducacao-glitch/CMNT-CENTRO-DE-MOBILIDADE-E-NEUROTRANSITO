async function submitHSIDothP(){
 if(!S.user)return auth();
 var form=document.getElementById("hsiDothPForm"),cons=document.getElementById("hsiConsent"),out=document.getElementById("hsiResult");if(!form||!cons)return;
 if(!cons.checked){out.innerHTML='<div class="p-4 rounded-2xl bg-red-50 text-red-700 font-semibold">É necessário autorizar o registro para concluir o questionário.</div>';return}
 var answers={};for(var i=0;i<HSI_DOTH_P.length;i++){var el=form.querySelector('input[name="hsi_'+i+'"]:checked');if(!el){out.innerHTML='<div class="p-4 rounded-2xl bg-amber-50 text-amber-800 font-semibold">Responda todos os 25 itens antes de concluir.</div>';return}answers[i]=Number(el.value)}
 var dims={decision:[],organization:[],time:[],humanization:[],psychocomportamental:[]};HSI_DOTH_P.forEach(function(q,i){dims[q[0]].push(answers[i])});
 var scores={};Object.keys(dims).forEach(function(k){var avg=dims[k].reduce(function(a,b){return a+b},0)/dims[k].length;scores[k]=Math.round(((avg-1)/4*100)*100)/100});
 var total=Math.round(((scores.decision+scores.organization+scores.time+scores.humanization+scores.psychocomportamental)/5)*100)/100;
 var interpretation=total<40?"Atenção prioritária e reflexão orientada":total<60?"Faixa de desenvolvimento com pontos de atenção":total<75?"Desenvolvimento intermediário":total<90?"Competências consolidadas com oportunidades de aprimoramento":"Desempenho elevado no instrumento, mantendo revisão contínua";
 var r=await db.from("hsi_doth_p_assessments").insert({user_id:S.user.id,consent:true,answers:answers,decision_score:scores.decision,organization_score:scores.organization,time_score:scores.time,humanization_score:scores.humanization,psychocomportamental_score:scores.psychocomportamental,total_score:total,interpretation:interpretation}).select("id").single();
 if(r.error){out.innerHTML='<div class="p-4 rounded-2xl bg-red-50 text-red-700 font-semibold">'+esc(r.error.message)+'</div>';return}
 await cmntLog("hsi","assessment_completed",{assessment_id:r.data&&r.data.id||null,total_score:total});
 out.innerHTML='<div class="brand text-white rounded-3xl p-5"><div class="text-xs uppercase tracking-widest text-emerald-300 font-black">RESULTADO HSI-DOTH-P</div><div class="text-4xl font-black mt-1">'+total.toFixed(1)+'/100</div><p class="text-white/80 mt-2">'+esc(interpretation)+'</p><div class="grid sm:grid-cols-5 gap-2 mt-4">'+[["Decisão",scores.decision],["Organização",scores.organization],["Tempo",scores.time],["Humanização",scores.humanization],["Psicocomportamental",scores.psychocomportamental]].map(function(x){return'<div class="rounded-2xl bg-white/10 p-3"><div class="text-xs text-white/65">'+x[0]+'</div><b class="text-xl">'+Number(x[1]).toFixed(1)+'</b></div>'}).join('')+'</div></div>';
 await cmntLog("hsi","result_viewed",{assessment_id:r.data&&r.data.id||null});
}

function communityCommitment(){document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal" style="position:fixed;inset:0;z-index:80;overflow-y:auto;overflow-x:hidden;height:100vh;height:100dvh;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;"><div class="relative mx-auto w-full max-w-3xl bg-white rounded-3xl shadow-2xl" style="position:relative;top:auto;bottom:auto;margin:80px auto calc(100px + env(safe-area-inset-bottom, 0px));width:calc(100% - 24px);max-width:48rem;display:block;overflow:visible;"><div class="shrink-0 bg-white border-b border-slate-200 px-4 sm:px-5 py-3 flex justify-between items-start gap-4"><div class="min-w-0"><div class="text-[10px] uppercase tracking-widest text-[#0b8b55] font-black">ENAT — REDE NEUROTRÂNSITO</div><h2 class="text-xl sm:text-2xl font-black mt-1">Compromisso de Respeito e Convivência</h2><p class="text-xs text-slate-500 mt-1">Leia o compromisso antes de concluir seu cadastro.</p></div><button onclick="closeCommunityCommitment()" class="shrink-0 text-2xl text-slate-400" aria-label="Fechar">×</button></div><div class="px-4 sm:px-5 py-4" id="communityCommitmentScroll" style="display:block;height:auto;min-height:0;max-height:none;overflow:visible;"><div class="text-[13px] text-slate-600 leading-5 space-y-3"><p><b class="text-slate-800">A Rede Neurotrânsito é uma rede social temática.</b> Seu propósito é conectar pessoas, conhecimento, educação, pesquisa e experiências relacionadas ao trânsito, à mobilidade, à segurança viária e ao fator humano.</p><p><b class="text-slate-800">1. Tema da rede.</b> Publicações, discussões, comunidades, eventos e transmissões devem ter relação clara e relevante com trânsito, mobilidade, educação para o trânsito, segurança viária, neurociência aplicada, comportamento, formação profissional, legislação, acessibilidade, infraestrutura, tecnologia ou áreas diretamente conectadas ao tema.</p><p><b class="text-slate-800">2. Sem campanhas políticas.</b> A rede não é espaço para campanha eleitoral, propaganda político-partidária, pedido de voto, promoção de candidatos ou partidos, disputa ideológica partidária ou mobilização política alheia à finalidade técnica e educacional da plataforma. Discussões sobre políticas públicas de trânsito podem ocorrer quando tratadas de forma pertinente, responsável e relacionada ao objeto da rede.</p><p><b class="text-slate-800">3. Sem conteúdo sem relação com o trânsito.</b> Não utilizaremos a rede para divulgação comercial, promocional ou temática que não tenha conexão legítima com trânsito, mobilidade, segurança, educação, formação ou assuntos correlatos. Conteúdos patrocinados também deverão respeitar a finalidade da rede e serão identificados de forma clara.</p><p><b class="text-slate-800">4. Respeito às pessoas.</b> Não são permitidos assédio, ameaças, discriminação, humilhação, perseguição, violência, exposição indevida de dados pessoais, incitação a comportamento perigoso ou conteúdo que coloque pessoas em risco.</p><p><b class="text-slate-800">5. Responsabilidade sobre o conteúdo.</b> Cada participante é responsável pelo que publica. Informação técnica, científica ou normativa deve ser apresentada com responsabilidade e, quando necessário, acompanhada de fontes. A existência de uma publicação na rede não significa endosso institucional da ENAT.</p><p><b class="text-slate-800">6. Moderação.</b> Conteúdos que violem este compromisso, as regras da plataforma ou a legislação aplicável poderão ser ocultados ou removidos, e contas poderão sofrer restrições ou suspensão conforme a gravidade e a reincidência.</p><p><b class="text-slate-800">7. Convivência.</b> Divergências são permitidas; ataques pessoais não. A proposta é transformar experiências e opiniões em conhecimento útil para um trânsito mais seguro e humano.</p><div class="rounded-2xl bg-emerald-50 border border-emerald-100 p-3 text-xs sm:text-sm text-slate-700"><b class="text-emerald-800">Princípio ENAT:</b> segurança antes do ruído, informação antes da desinformação e pessoas antes dos veículos.</div></div></div><div id="communityAcceptanceArea" class="shrink-0 border-t border-slate-200 bg-white px-4 sm:px-5 py-3"><label class="flex items-start gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-3 cursor-pointer"><input id="communityAccept" type="checkbox" class="mt-1" onchange="acceptCommunityCommitment(this)"><span class="text-sm text-slate-700"><b>Li, compreendi e aceito o Compromisso de Respeito e Convivência da Rede Neurotrânsito.</b><small class="block text-xs text-slate-500 mt-1">Depois de aceitar, clique no botão abaixo para concluir o cadastro e acessar a rede social.</small></span></label><button id="communityAccessButton" type="button" disabled class="hidden w-full mt-3 bg-[#07111f] text-white rounded-xl py-3 font-black disabled:opacity-50" onclick="CMNT_IDENTITY_COMMITMENT_MODE?acceptIdentityCommitment():completeRegistration()">Concluir cadastro e acessar a rede social</button></div></div></div>';var sc=document.getElementById('communityCommitmentScroll');if(sc)sc.scrollTop=0}

function privacyPolicy(){document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[80] grid place-items-center p-3 sm:p-4"><div class="bg-white rounded-3xl p-5 w-full max-w-2xl max-h-[calc(100vh-24px)] overflow-auto"><div class="flex justify-between items-center"><h2 class="text-2xl font-black">Aviso de Privacidade — ENAT</h2><button onclick="closePrivacyPolicy()" class="text-2xl text-slate-400">×</button></div><div class="text-sm text-slate-600 leading-7 mt-5 space-y-4"><p>O ENAT coleta dados necessários para criar e proteger a conta, permitir a participação na comunidade e cumprir obrigações aplicáveis. Entre eles podem estar nome, e-mail, cidade, estado, data de nascimento e informações de credencial fornecidas no cadastro.</p><p>Dados de nascimento e credencial são tratados como informações de cadastro e <b>não são exibidos publicamente no perfil</b>. Cidade e estado podem aparecer no perfil conforme as configurações da plataforma.</p><p>O titular pode solicitar informações, acesso, correção, eliminação quando aplicável, revogação de consentimento e outros direitos previstos na LGPD, pelos canais disponibilizados pela plataforma.</p><p>O ENAT adotará medidas de segurança e limitará o uso dos dados às finalidades informadas. A política deverá ser atualizada quando houver mudança relevante no tratamento.</p><p><b>Versão do aviso: 1.0</b></p></div><button onclick="auth();if(!reg)toggleAuth()" class="w-full mt-5 bg-[#07111f] text-white rounded-2xl p-3 font-black">Voltar ao cadastro</button></div></div>'}

function createPost(){if(!S.user)return auth();document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] flex items-center justify-center p-3 sm:p-5 overflow-y-auto" style="display:flex!important;align-items:center!important;justify-content:center!important;padding:clamp(12px,3vh,28px)!important;overflow-y:auto!important"><section role="dialog" aria-modal="true" aria-labelledby="postModalTitle" class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col min-h-0 overflow-hidden" style="width:min(680px,calc(100vw - 24px));max-height:90vh;max-height:90dvh;margin:auto;display:flex;flex-direction:column"><header class="shrink-0 flex items-center justify-between gap-3 border-b border-slate-100 px-5 py-4"><div><div class="text-[10px] uppercase tracking-widest text-[#0b8b55] font-black">ENAT · REDE NEUROTRÂNSITO</div><h2 id="postModalTitle" class="text-xl sm:text-2xl font-black mt-1">Nova publicação</h2></div><button type="button" onclick="closeModal()" aria-label="Fechar" class="shrink-0 w-10 h-10 rounded-xl bg-slate-100 text-slate-500 text-2xl">×</button></header><div class="p-4 sm:p-5 overflow-y-auto overscroll-contain"><label for="pc" class="block text-sm font-bold text-slate-700 mb-2">O que você quer compartilhar?</label><textarea id="pc" rows="4" class="w-full bg-slate-100 rounded-2xl p-4 resize-y" placeholder="Compartilhe uma experiência, notícia ou solução sobre trânsito..."></textarea><div class="mt-4"><label for="postLink" class="block text-sm font-bold text-slate-700 mb-2">Adicionar link <span class="font-normal text-slate-500">(opcional)</span></label><input id="postLink" type="url" inputmode="url" oninput="previewPostLink(this.value)" class="w-full bg-slate-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Cole aqui o endereço https://..."><div id="postLinkPreview" class="hidden mt-2 rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm break-all"></div><p class="text-xs text-slate-500 mt-2">O link será incluído na publicação e ficará clicável para os outros membros.</p></div><label class="mt-4 flex items-center justify-between gap-3 bg-slate-100 rounded-2xl p-4 cursor-pointer"><span><b class="block">Adicionar foto ou vídeo</b><small id="pfileName" class="text-slate-500">JPG, PNG, WEBP, GIF, MP4, WEBM ou MOV · até 50 MB</small></span><span class="shrink-0 bg-white border border-slate-200 px-4 py-2 rounded-xl font-bold">Escolher arquivo</span><input id="pfile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" class="hidden" onchange="previewAttachment(this)"></label><div id="pfilePreview" class="hidden mt-3 rounded-2xl overflow-hidden bg-slate-100"></div><label for="pl" class="block text-sm font-bold text-slate-700 mt-4 mb-2">Localização <span class="font-normal text-slate-500">(opcional)</span></label><input id="pl" class="w-full bg-slate-100 rounded-xl p-3" placeholder="Cidade, local ou região"><button type="button" onclick="publish()" class="w-full bg-[#0b8b55] hover:bg-emerald-700 text-white rounded-xl p-3.5 mt-4 font-black">Publicar</button></div></section></div>'}
function previewPostLink(value){var box=document.getElementById('postLinkPreview');if(!box)return;var v=(value||'').trim();if(!v){box.classList.add('hidden');box.textContent='';return}try{var u=new URL(v);if(!['http:','https:'].includes(u.protocol))throw new Error('URL');box.classList.remove('hidden');box.innerHTML='<div class="font-bold text-slate-800">🔗 Link anexado</div><div class="text-slate-500 mt-1">'+esc(u.hostname)+'</div><div class="text-slate-700 mt-1">'+esc(u.href)+'</div>'}catch(e){box.classList.remove('hidden');box.textContent='Informe um endereço completo começando com https://'}}
function previewAttachment(input){var f=input.files&&input.files[0],n=document.getElementById('pfileName'),p=document.getElementById('pfilePreview');if(!f)return;n.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB';if(f.size>52428800){n.textContent='Arquivo acima do limite de 50 MB';input.value='';p.classList.add('hidden');return}var u=window.URL.createObjectURL(f);p.classList.remove('hidden');p.innerHTML=f.type.indexOf('video/')===0?'<video controls class="w-full max-h-80" src="'+u+'"></video>':'<img class="w-full max-h-80 object-cover" src="'+u+'">'}
async function publish(){var c=document.getElementById('pc').value.trim(),link=(document.getElementById('postLink')?.value||'').trim(),f=document.getElementById('pfile').files[0],l=document.getElementById('pl').value.trim();if(link){try{var linkUrl=new URL(link);if(!['http:','https:'].includes(linkUrl.protocol))throw new Error('URL');link=linkUrl.href}catch(e){return toast('Cole um link válido começando com https://',true)}if(!/(^|\s)https?:\/\//i.test(c))c=(c?c+'\n\n':'')+link}if(!c&&!f)return toast('Escreva algo ou adicione um link ou arquivo.',true);if(f&&f.size>52428800)return toast('O arquivo deve ter no máximo 50 MB.',true);var media_url=null,media_type=null,path=null;if(f){var ok=['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'].includes(f.type);if(!ok)return toast('Formato de arquivo não permitido.',true);var ext=(f.name.split('.').pop()||'bin').toLowerCase();path=S.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;var up=await db.storage.from('social-media').upload(path,f,{contentType:f.type,upsert:false});if(up.error)return toast('Não foi possível enviar o anexo: '+up.error.message,true);media_url=db.storage.from('social-media').getPublicUrl(path).data.publicUrl;media_type=f.type.indexOf('video/')===0?'video':'image'}var r=await db.from('social_posts').insert({author_id:S.user.id,content:c,media_url:media_url,media_type:media_type,location:l||null});if(r.error){if(f&&path)await db.storage.from('social-media').remove([path]);return toast(r.error.message,true)}closeModal();await load();S.tab='home';shell();toast('Publicação criada.')}

toast('Não foi possível concluir o cadastro: '+((r.data&&r.data.error)||(r.error&&r.error.message)||'resposta inválida'),true)}CMNT_IDENTITY_COMPLETION_ACTIVE=false;CMNT_IDENTITY_GUIDELINES_ACCEPTED=false;CMNT_IDENTITY_PENDING=null;closeModal();await init();toast('Cadastro validado. Bem-vindo à Rede Neurotrânsito.')}

async function init(){if(!db)return;try{var s=await db.auth.getSession();S.user=s.data.session?s.data.session.user:null;if(S.user){S.profile=await ensureProfile();if(!S.profile)throw new Error('Não foi possível criar o perfil do usuário autenticado.');var ir=await db.from('social_identity').select('user_id,birth_date,credential_type,credential_number,lgpd_consent,community_guidelines_accepted,consent_at,guidelines_accepted_at,privacy_policy_version').eq('user_id',S.user.id).maybeSingle();if(ir.error)throw new Error('Não foi possível validar os dados de cadastro.');var ident=ir.data;var identityComplete=!!(ident&&ident.birth_date&&ident.credential_type&&ident.credential_number&&ident.lgpd_consent===true&&ident.community_guidelines_accepted===true&&ident.consent_at&&ident.guidelines_accepted_at&&ident.privacy_policy_version==='1.0'&&S.profile.city&&S.profile.state);if(!identityComplete){if(!CMNT_IDENTITY_COMPLETION_ACTIVE){CMNT_IDENTITY_PENDING={birth_date:ident&&ident.birth_date,credential_type:ident&&ident.credential_type,credential_number:ident&&ident.credential_number,city:S.profile.city||(S.user.user_metadata||{}).city||'',state:S.profile.state||(S.user.user_metadata||{}).state||''};showSocialIdentityCompletion()}return}else if(CMNT_IDENTITY_COMPLETION_ACTIVE){CMNT_IDENTITY_COMPLETION_ACTIVE=false;closeModal()}var f=await db.from('social_follows').select('following_id').eq('follower_id',S.user.id);S.following=new Set((f.data||[]).map(function(x){return x.following_id}))}else{CMNT_IDENTITY_COMPLETION_ACTIVE=false;S.profile={display_name:'Visitante',username:'visitante'}}await load();shell();setTimeout(function(){var q=new URLSearchParams(window.location.search);var gid=q.get('live_guest');if(gid)cmntOpenGuestInvite(gid)},250)}catch(e){console.error(e);bootError(e)}}
function startCmntApp(){
  if(!db){bootError(new Error('Cliente Supabase não carregou. Os dois CDNs de fallback foram tentados.'));return}
  try{shell()}catch(e){bootError(e);return}
  var watchdog=setTimeout(function(){
    var a=document.getElementById('app');
    if(a&&a.innerText&&a.innerText.indexOf('Carregando a rede social')>=0){
      bootError(new Error('A inicialização do Supabase demorou mais que o limite de segurança. A interface foi interrompida para evitar uma tela infinita.'));
    }
  },10000);
  db.auth.onAuthStateChange(function(event){if(event==='PASSWORD_RECOVERY'){setTimeout(passwordRecovery,0);return}setTimeout(init,0)});
  init().finally(function(){clearTimeout(watchdog)});
}
if(db){startCmntApp()}else{bootError(new Error('Cliente Supabase não carregou. Os dois CDNs de fallback foram tentados.'))}
</script>
<script>
async function cmntOpenNeuroDriveCourseAccess(){
  if(!S.user){auth();return}
  try{
    var result=await db.functions.invoke('neurodrive-course-access',{body:{action:'issue_courses'}});
    if(result.error){
      var msg=(result.data&&result.data.error)||result.error.message||'acesso não autorizado';
      toast('Não foi possível abrir o curso NeuroDrive: '+msg,true);
      return;
    }
    var ticket=result.data&&result.data.ticket;
    if(!ticket){toast('A autorização do curso não foi gerada.',true);return}
    window.location.href='https://neurodrive.hsi-doth-pg.com.br/?access='+encodeURIComponent(ticket);
  }catch(err){
    toast('Não foi possível abrir o curso NeuroDrive. Tente novamente.',true);
  }
}</script></body>
