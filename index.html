async function cmntSubmitSponsorship(){
 var name=(document.getElementById('sponsorName')||{}).value||'';
 var company=(document.getElementById('sponsorCompany')||{}).value||'';
 var email=(document.getElementById('sponsorEmail')||{}).value||'';
 var whatsapp=(document.getElementById('sponsorWhatsapp')||{}).value||'';
 var interest=(document.getElementById('sponsorInterest')||{}).value||'';
 var message=(document.getElementById('sponsorMessage')||{}).value||'';
 var consent=!!((document.getElementById('sponsorConsent')||{}).checked);
 name=name.trim();company=company.trim();email=email.trim();whatsapp=whatsapp.trim();message=message.trim();
 if(!name||!email||!interest)return toast('Preencha nome, e-mail e interesse.',true);
 if(!consent)return toast('É necessário autorizar o contato para enviar seu interesse.',true);
 var payload={name:name,company:company||null,email:email,whatsapp:whatsapp||null,interest_type:interest,message:message||null,consent:true,source:'cmnt_header'};
 var r=await db.from('cmnt_sponsorship_leads').insert(payload);
 if(r.error)return toast('Não foi possível registrar seu interesse: '+r.error.message,true);
 closeModal();toast('Interesse recebido. A ENAT entrará em contato para apresentar as opções de parceria.');
}

function composer(){return'<div class="card rounded-3xl p-4"><div class="flex gap-3"><img src="'+av(S.profile)+'" class="w-11 h-11 rounded-2xl"><button onclick="createPost()" class="flex-1 text-left bg-slate-100 text-slate-500 rounded-2xl px-4">O que está acontecendo no trânsito?</button></div><div class="flex justify-between mt-3 pt-3 border-t text-sm"><button onclick="createPost()" class="font-bold text-slate-600">▧ Foto</button><button onclick="createPost()" class="font-bold text-slate-600">▶ Vídeo</button><button onclick="createPost()" class="font-bold text-amber-600">⚠ Alerta</button><button onclick="createPost()" class="font-bold text-[#0b8b55]">Publicar</button></div></div>'}
async function like(id){if(!S.user)return auth();var has=S.likes.has(id);if(has){var d=await db.from('social_reactions').delete().eq('post_id',id).eq('user_id',S.user.id).eq('reaction','like');if(d.error)return toast('Não foi possível retirar a curtida.',true);S.likes.delete(id)}else{var d=await db.from('social_reactions').insert({post_id:id,user_id:S.user.id,reaction:'like'});if(d.error)return toast('Não foi possível curtir.',true);S.likes.add(id);var p=S.posts.find(function(x){return x.id===id});if(p&&p.author_id)await notifyUser(p.author_id,'like',(S.profile.display_name||'Alguém')+' curtiu sua publicação.')}await loadPosts();render()}
async function bookmark(id){if(!S.user)return auth();var has=S.saved.has(id);if(has){var d=await db.from('social_bookmarks').delete().eq('post_id',id).eq('user_id',S.user.id);if(d.error)return toast('Não foi possível remover dos salvos.',true);S.saved.delete(id);toast('Publicação removida dos salvos.')}else{var d=await db.from('social_bookmarks').insert({post_id:id,user_id:S.user.id});if(d.error)return toast('Não foi possível salvar.',true);S.saved.add(id);toast('Publicação salva.')}await loadPosts();render()}
async function share(id){if(!S.user)return auth();var d=await db.from('social_post_shares').upsert({post_id:id,user_id:S.user.id},{onConflict:'post_id,user_id'});if(d.error)return toast('Não foi possível registrar o compartilhamento.',true);await loadPosts();render();var url=location.origin+location.pathname+'?post='+encodeURIComponent(id);try{if(navigator.share){await navigator.share({title:'CMNT — publicação',url:url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('Link copiado para a área de transferência.')}else{window.prompt('Copie o link da publicação:',url)}}catch(e){if(e&&e.name!=='AbortError')toast('Não foi possível compartilhar.',true)}}

}
async function editComment(commentId,postId){
 var body=document.getElementById('comment-body-'+commentId);if(!body)return;
 var current=body.textContent||'';var value=window.prompt('Edite seu comentário:',current);if(value===null)return;value=value.trim();if(!value)return toast('O comentário não pode ficar vazio.',true);

async function deleteComment(commentId,postId){

 var r=await db.from('social_comments').delete().eq('id',commentId).eq('author_id',S.user.id);if(r.error)return toast('Não foi possível excluir o comentário.',true);
 if(S.stats[postId])S.stats[postId].comments_count=Math.max(0,Number(S.stats[postId].comments_count||0)-1);
 await comments(postId);render()
}
async function addComment(id){
 var el=document.getElementById('commentText');var content=(el&&el.value||'').trim();if(!content)return;
 var r=await db.from('social_comments').insert({post_id:id,author_id:S.user.id,content:content});if(r.error)return toast('Não foi possível comentar.',true);var p=S.posts.find(function(x){return x.id===id});if(p&&p.author_id)await notifyUser(p.author_id,'comment',(S.profile.display_name||'Alguém')+' comentou na sua publicação.');

async function loadRecentMessagePeople(){
 var box=document.getElementById('msgPeople');if(!box||!S.user)return;
 var r=await db.from('social_messages').select('sender_id,recipient_id,content,read_at,created_at').or('sender_id.eq.'+S.user.id+',recipient_id.eq.'+S.user.id).order('created_at',{ascending:false}).limit(200);
 if(r.error){box.innerHTML='<div class="text-sm text-slate-400 p-3">Não foi possível carregar as conversas recentes. Busque uma pessoa para iniciar.</div>';return}
 var recent={},ids=[];
 (r.data||[]).forEach(function(m){var other=m.sender_id===S.user.id?m.recipient_id:m.sender_id;if(!other||other===S.user.id)return;if(!recent[other]){recent[other]={id:other,content:m.content||'',created_at:m.created_at,unread:0}}if(m.recipient_id===S.user.id&&!m.read_at)recent[other].unread++});
 ids=Object.keys(recent);
 if(!ids.length){box.innerHTML='<div class="text-sm text-slate-400 p-3">Nenhuma conversa ainda. Busque uma pessoa para iniciar.</div>';S_MSG.profiles=[];return}
 var pr=await db.from('social_profiles').select('id,display_name,username,avatar_url,city,state').in('id',ids);
 var profiles=pr.error?[]:(pr.data||[]),byId={};profiles.forEach(function(p){byId[p.id]=p});
 S_MSG.profiles=ids.map(function(id){return byId[id]||{id:id,display_name:'Membro',username:'membro'}});
 ids.sort(function(a,b){return new Date(recent[b].created_at)-new Date(recent[a].created_at)});
 box.innerHTML=ids.map(function(id){var p=byId[id]||{id:id,display_name:'Membro',username:'membro'},m=recent[id];return'<button onclick="openMessageThread(\''+id+'\')" class="w-full flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 text-left"><img src="'+av(p)+'" class="w-10 h-10 rounded-xl object-cover"><span class="min-w-0 flex-1"><b class="block truncate">'+esc(p.display_name||'Usuário')+'</b><small class="block truncate text-slate-500">'+esc(m.content.slice(0,70))+'</small></span>'+(m.unread?'<span class="rounded-full bg-emerald-600 text-white text-xs px-2 py-1">'+m.unread+'</span>':'')+'</button>'}).join('');
}

}
async function openMessageThread(id){
 if(!S.user||!id)return;S_MSG.target=id;var p=S_MSG.profiles.find(function(x){return x.id===id});
 if(!p){var pr=await db.from('social_profiles').select('id,display_name,username,avatar_url').eq('id',id).maybeSingle();p=pr.data||{id:id,display_name:'Usuário',username:'usuario'}}

 if(r.error){toast('Não foi possível carregar a conversa: '+r.error.message,true);return}
 var unread=(r.data||[]).filter(function(x){return x.recipient_id===S.user.id&&!x.read_at}).map(function(x){return x.id});

 thread.className='flex-1 overflow-auto';thread.innerHTML='<div class="flex items-center gap-3 pb-4 border-b"><img src="'+av(p)+'" class="w-11 h-11 rounded-2xl"><div><b>'+esc(p.display_name||'Usuário')+'</b><div class="text-xs text-slate-500">@'+esc(p.username||'usuario')+'</div></div></div><div id="msgList" class="py-4 space-y-2">'+((r.data||[]).map(function(x){var mine=x.sender_id===S.user.id;return'<div class="flex '+(mine?'justify-end':'justify-start')+'"><div class="max-w-[78%] px-4 py-3 rounded-2xl '+(mine?'bg-[#07111f] text-white':'bg-slate-100 text-slate-700')+'"><div class="whitespace-pre-wrap">'+esc(x.content)+'</div><div class="text-[10px] mt-1 '+(mine?'text-white/65':'text-slate-400')+'">'+ago(x.created_at)+'</div></div></div>'}).join(''))||'<div class="text-center text-slate-400 py-10">Inicie a conversa.</div>'+'</div>';composer.classList.remove('hidden');setTimeout(function(){thread.scrollTop=thread.scrollHeight},0);
}
async function sendMessage(){
 if(!S.user||!S_MSG.target)return;var el=document.getElementById('msgText'),content=(el&&el.value||'').trim();if(!content)return;
 var r=await db.from('social_messages').insert({sender_id:S.user.id,recipient_id:S_MSG.target,content:content});if(r.error)return toast('Não foi possível enviar a mensagem: '+r.error.message,true);

function cmntLiveGuestSearch(){
 var input=document.getElementById('liveGuestSearch'),box=document.getElementById('liveGuestResults');
 if(!input||!box)return;
 var q=input.value.trim().replace(/^@+/,'');
 if(q.length<2){box.classList.add('hidden');box.innerHTML='';return}
 var seq=++CMNT_LIVE_FORM.searchSeq;
 Promise.all([
   db.from('social_profiles').select('id,display_name,username,avatar_url').ilike('display_name','%'+q+'%').limit(8),
   db.from('social_profiles').select('id,display_name,username,avatar_url').ilike('username','%'+q+'%').limit(8)
 ]).then(function(rs){
   if(seq!==CMNT_LIVE_FORM.searchSeq)return;
   var map={};rs.forEach(function(r){(r.data||[]).forEach(function(x){if(x.id&&x.id!==S.user.id)map[x.id]=x})});
   CMNT_LIVE_FORM.guestResults=Object.keys(map).map(function(id){return map[id]}).filter(function(x){return !CMNT_LIVE_FORM.guests.some(function(g){return g.id===x.id})}).slice(0,8);

function cmntStageRenderRequests(){var box=document.getElementById('cmntStageRequests');if(!box)return;var ids=Object.keys(CMNT_LIVE.stageRequests||{});if(!ids.length){box.innerHTML='<div class="text-xs text-slate-400">Nenhuma solicitação pendente.</div>';return}box.innerHTML=ids.map(function(id){var r=CMNT_LIVE.stageRequests[id];return '<div class="cmnt-stage-request"><div><b>'+esc(r.name||'Convidado')+'</b><div class="text-xs text-slate-500 mt-1">Solicitou participação no palco</div></div><div class="flex gap-2"><button onclick="cmntHostApproveGuest(\''+id+'\')" class="bg-[#0b8b55] text-white px-3 py-2 rounded-xl font-black">Aceitar</button><button onclick="cmntHostRejectGuest(\''+id+'\')" class="bg-slate-100 text-slate-700 px-3 py-2 rounded-xl font-black">Recusar</button></div></div>'}).join('')}
function cmntStageRender(){var box=document.getElementById('cmntStageGrid');if(!box)return;var cards=[{id:'host',name:(S.profile&&S.profile.display_name)||'Apresentador',stream:CMNT_LIVE.hostStream,host:true}];Object.keys(CMNT_LIVE.stageGuests||{}).forEach(function(id){var g=CMNT_LIVE.stageGuests[id];if(g&&g.stream)cards.push({id:id,name:g.name||'Convidado',stream:g.stream})});box.innerHTML=cards.map(function(c){return '<div class="cmnt-stage-tile '+(c.host?'is-host':'')+'"><video id="cmntStageVideo_'+esc(c.id)+'" autoplay muted playsinline></video><div class="cmnt-stage-name">'+(c.host?'🎙️ ':'👤 ')+esc(c.name)+'</div>'+(c.host?'':'<button type="button" onclick="cmntHostRemoveGuest(\''+esc(c.id)+'\')" class="cmnt-stage-remove">Remover</button>')+'</div>'}).join('');cards.forEach(function(c){var v=document.getElementById('cmntStageVideo_'+c.id);if(v&&c.stream)v.srcObject=c.stream});cmntStageRenderRequests()}
function cmntStageEnsureComposer(){if(!CMNT_LIVE.hostStream||CMNT_LIVE.stageCanvas)return;var canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;CMNT_LIVE.stageCanvas=canvas;CMNT_LIVE.stageCtx=canvas.getContext('2d');try{var AC=window.AudioContext||window.webkitAudioContext;if(AC){var ac=new AC();var dest=ac.createMediaStreamDestination();CMNT_LIVE.stageAudioContext=ac;CMNT_LIVE.stageAudioDestination=dest;ac.createMediaStreamSource(CMNT_LIVE.hostStream).connect(dest)}}catch(e){console.warn('CMNT stage audio mixer',e)}var out=canvas.captureStream(30);if(CMNT_LIVE.stageAudioDestination)CMNT_LIVE.stageAudioDestination.stream.getAudioTracks().forEach(function(t){out.addTrack(t)});CMNT_LIVE.hostBroadcastStream=out;cmntStageDraw()}
function cmntStageAttachGuestAudio(stream){if(!stream||!CMNT_LIVE.stageAudioContext||!CMNT_LIVE.stageAudioDestination)return;try{CMNT_LIVE.stageAudioContext.createMediaStreamSource(stream).connect(CMNT_LIVE.stageAudioDestination)}catch(e){console.warn('CMNT guest audio mix',e)}}
function cmntStagePublishStream(){var out=CMNT_LIVE.hostBroadcastStream||CMNT_LIVE.hostStream;if(!out)return;Object.keys(CMNT_LIVE.hostPeers||{}).forEach(function(id){var pc=CMNT_LIVE.hostPeers[id];if(!pc)return;var senders=pc.getSenders(),vt=out.getVideoTracks()[0],at=out.getAudioTracks()[0],vs=senders.find(function(x){return x.track&&x.track.kind==='video'}),as=senders.find(function(x){return x.track&&x.track.kind==='audio'});if(vs&&vt)vs.replaceTrack(vt).catch(function(){});if(as&&at)as.replaceTrack(at).catch(function(){})})}
function cmntStageDraw(){var c=CMNT_LIVE.stageCanvas,ctx=CMNT_LIVE.stageCtx;if(!c||!ctx)return;var W=c.width,H=c.height;ctx.fillStyle='#07111f';ctx.fillRect(0,0,W,H);var cards=[{id:'host',name:(S.profile&&S.profile.display_name)||'Apresentador',stream:CMNT_LIVE.hostStream}];Object.keys(CMNT_LIVE.stageGuests||{}).forEach(function(id){var g=CMNT_LIVE.stageGuests[id];if(g&&g.stream)cards.push({id:id,name:g.name||'Convidado',stream:g.stream})});var count=cards.length,cols=count<=2?2:3,rows=Math.ceil(count/cols),gap=10,tileW=(W-gap*(cols+1))/cols,tileH=(H-gap*(rows+1))/rows;cards.forEach(function(card,i){var col=i%cols,row=Math.floor(i/cols),x=gap+col*(tileW+gap),y=gap+row*(tileH+gap);ctx.fillStyle='#0f2435';ctx.fillRect(x,y,tileW,tileH);try{var el=document.getElementById('cmntStageVideo_'+card.id);if(el&&el.readyState>=2)ctx.drawImage(el,x,y,tileW,tileH)}catch(e){}ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y+tileH-42,tileW,42);ctx.fillStyle='#fff';ctx.font='700 22px Inter,Arial,sans-serif';ctx.fillText((card.id==='host'?'🎙️ ':'👤 ')+String(card.name||'Participante').slice(0,48),x+14,y+tileH-14)});CMNT_LIVE.stageFrameTimer=requestAnimationFrame(cmntStageDraw)}
async function cmntHostApproveGuest(id){var req=CMNT_LIVE.stageRequests[id];if(!req||!CMNT_LIVE.hostChannel)return;if(cmntStageGuestCount()>=cmntStageGuestLimit()){toast('O palco já atingiu o limite de 4 convidados.',true);return}delete CMNT_LIVE.stageRequests[id];cmntStageRenderRequests();await cmntLiveSend(CMNT_LIVE.hostChannel,'stage',{kind:'accepted',target:id,from:S.user.id})}

function cmntHostStageGuestOfferHandler(p){var id=p.from;if(!id||!p.description)return;if(!CMNT_LIVE.stageGuests[id]){if(cmntStageGuestCount()>=cmntStageGuestLimit())return;var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});CMNT_LIVE.stageGuests[id]={id:id,name:p.name||'Convidado',pc:pc,stream:null,audioMixed:false};pc.addTransceiver('audio',{direction:'recvonly'});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=function(e){var g=CMNT_LIVE.stageGuests[id];if(!g)return;if(!g.stream)g.stream=new MediaStream();if(e.track&&!g.stream.getTracks().some(function(t){return t.id===e.track.id}))g.stream.addTrack(e.track);if(!g.audioMixed&&g.stream.getAudioTracks().length){cmntStageAttachGuestAudio(g.stream);g.audioMixed=true}cmntStageRender();cmntStagePublishStream()};pc.onicecandidate=function(e){if(e.candidate)cmntLiveSend(CMNT_LIVE.hostChannel,'stage',{kind:'candidate',from:S.user.id,target:id,candidate:e.candidate})};pc.onconnectionstatechange=function(){if(['failed','disconnected','closed'].includes(pc.connectionState))cmntHostRemoveGuest(id)}}cmntHostStageGuestOffer(id,p.description)}
function cmntHostStageGuestOffer(id,description){var g=CMNT_LIVE.stageGuests[id];if(!g||!g.pc)return;g.pc.setRemoteDescription(new RTCSessionDescription(description)).then(function(){return g.pc.createAnswer()}).then(function(a){return g.pc.setLocalDescription(a)}).then(function(){return cmntLiveSend(CMNT_LIVE.hostChannel,'stage',{kind:'answer',target:id,from:S.user.id,description:g.pc.localDescription})}).catch(function(e){console.error('CMNT guest answer',e)})}
function cmntHostStageGuestRequest(p){var id=p.from;if(!id||CMNT_LIVE.stageGuests[id]||CMNT_LIVE.stageRequests[id])return;if(cmntStageGuestCount()>=cmntStageGuestLimit()){cmntLiveSend(CMNT_LIVE.hostChannel,'stage',{kind:'rejected',target:id,from:S.user.id,reason:'limit'});return}CMNT_LIVE.stageRequests[id]={name:p.name||'Convidado'};cmntStageRenderRequests();toast((p.name||'Um convidado')+' solicitou entrar no palco.')}

async function cmntHostConnect(){
 var id=CMNT_LIVE.hostStreamId;
 var ch=db.channel(cmntLiveTopic(id),{config:{broadcast:{self:false},presence:{key:S.user.id}}});
 CMNT_LIVE.hostChannel=ch;
 ch.on('broadcast',{event:'signal'},async function(msg){
   var p=msg.payload||{};
   if(p.target!==S.user.id&&p.target!=='host')return;
   try{
    if(p.kind==='stage_request'){cmntHostStageGuestRequest(p);return}
    if(p.kind==='stage_offer'){cmntHostStageGuestOfferHandler(p);return}
    if(p.kind==='stage_candidate'){var sg=CMNT_LIVE.stageGuests[p.from];if(sg&&sg.pc&&p.candidate)await sg.pc.addIceCandidate(new RTCIceCandidate(p.candidate)).catch(function(){});return}
    if(p.kind==='stage_leave'){cmntHostRemoveGuest(p.from);return}
    if(p.kind==='join'){
      var viewer=p.from;if(!viewer)return;
      if(CMNT_LIVE.hostPeers[viewer]){try{CMNT_LIVE.hostPeers[viewer].close()}catch(e){}}
      var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
      CMNT_LIVE.hostPeers[viewer]=pc;
      (CMNT_LIVE.hostBroadcastStream||CMNT_LIVE.hostStream).getTracks().forEach(function(t){pc.addTrack(t,CMNT_LIVE.hostBroadcastStream||CMNT_LIVE.hostStream)});
      pc.onicecandidate=function(e){if(e.candidate)cmntLiveSend(ch,'signal',{kind:'candidate',from:S.user.id,target:viewer,candidate:e.candidate})};
      pc.onconnectionstatechange=function(){if(['failed','disconnected','closed'].includes(pc.connectionState)){try{pc.close()}catch(e){}delete CMNT_LIVE.hostPeers[viewer]}};
      var offer=await pc.createOffer();await pc.setLocalDescription(offer);
      await cmntLiveSend(ch,'signal',{kind:'offer',from:S.user.id,target:viewer,description:pc.localDescription});
    }else if(p.kind==='answer'){
      var pc=CMNT_LIVE.hostPeers[p.from];if(pc&&p.description)await pc.setRemoteDescription(new RTCSessionDescription(p.description));
    }else if(p.kind==='candidate'){
      var pc=CMNT_LIVE.hostPeers[p.from];if(pc&&p.candidate)await pc.addIceCandidate(new RTCIceCandidate(p.candidate)).catch(function(){});
    }
   }catch(e){console.error('CMNT host signaling',e)}
 });
 ch.on('broadcast',{event:'stage'},async function(msg){var p=msg.payload||{};if(p.kind==='request')cmntHostStageGuestRequest(p);else if(p.kind==='offer')cmntHostStageGuestOfferHandler(p);else if(p.kind==='candidate'){var sg=CMNT_LIVE.stageGuests[p.from];if(sg&&sg.pc&&p.candidate)await sg.pc.addIceCandidate(new RTCIceCandidate(p.candidate)).catch(function(){})}else if(p.kind==='leave')cmntHostRemoveGuest(p.from)});
 ch.on('broadcast',{event:'chat'},function(msg){cmntLiveAppendChat('cmntHostChat',msg.payload)});
 ch.on('broadcast',{event:'reaction'},function(msg){cmntLiveReaction(msg.payload)});
 ch.on('presence',{event:'sync'},function(){var n=cmntLivePresenceCount(ch);var el=document.getElementById('cmntLiveViewerCount');if(el)el.textContent=n;cmntLiveUpdateViewers(n)});
 ch.on('presence',{event:'leave'},function(){var n=cmntLivePresenceCount(ch);var el=document.getElementById('cmntLiveViewerCount');if(el)el.textContent=n;cmntLiveUpdateViewers(n)});
 ch.on('presence',{event:'join'},function(){var n=cmntLivePresenceCount(ch);var el=document.getElementById('cmntLiveViewerCount');if(el)el.textContent=n;cmntLiveUpdateViewers(n)});
 ch.on('broadcast',{event:'control'},function(msg){var p=msg.payload||{};if(p.kind==='leave'&&CMNT_LIVE.hostPeers[p.from]){try{CMNT_LIVE.hostPeers[p.from].close()}catch(e){}delete CMNT_LIVE.hostPeers[p.from]}});
 await new Promise(function(resolve,reject){var timer=setTimeout(function(){reject(new Error('O Realtime não respondeu ao conectar a live.'))},10000);ch.subscribe(function(status,err){if(status==='SUBSCRIBED'){clearTimeout(timer);resolve()}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){clearTimeout(timer);reject(err||new Error(status))}})});
 await ch.track({role:'host',host_id:S.user.id});
 toast('Live iniciada. A câmera está transmitindo.');
}

async function cmntStartRecording(){

 if(!window.MediaRecorder)return toast('Este navegador não suporta gravação de vídeo.',true);

 try{
   var recordStream=CMNT_LIVE.hostBroadcastStream||CMNT_LIVE.hostStream;var rec=mime?new MediaRecorder(recordStream,{mimeType:mime}):new MediaRecorder(recordStream);
   CMNT_LIVE.recorder=rec;CMNT_LIVE.recordingChunks=[];CMNT_LIVE.recordingStartedAt=Date.now();
   rec.ondataavailable=function(e){if(e.data&&e.data.size)CMNT_LIVE.recordingChunks.push(e.data)};

   rec.start(1000);

}
async function cmntStopRecording(){
 var rec=CMNT_LIVE.recorder;
 if(!rec)return null;
 return new Promise(function(resolve){
   var chunks=CMNT_LIVE.recordingChunks.slice(),started=CMNT_LIVE.recordingStartedAt||Date.now();
   rec.onstop=async function(){
     try{
       var all=CMNT_LIVE.recordingChunks.length?CMNT_LIVE.recordingChunks.slice():chunks;
       var blob=new Blob(all,{type:rec.mimeType||'video/webm'});
       var ext=(rec.mimeType||'').indexOf('mp4')>=0?'mp4':'webm';
       var path=S.user.id+'/live-recordings/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
       var up=await db.storage.from('social-media').upload(path,blob,{contentType:blob.type||'video/webm',upsert:false});
       if(up.error)throw up.error;
       var mediaUrl=db.storage.from('social-media').getPublicUrl(path).data.publicUrl;
       var title='Gravação — '+new Date(started).toLocaleString('pt-BR');
       var ins=await db.from('social_live_recordings').insert({live_stream_id:CMNT_LIVE.hostStreamId,owner_user_id:S.user.id,title:title,storage_path:path,media_url:mediaUrl,media_type:'video',duration_seconds:Math.max(1,Math.round((Date.now()-started)/1000)),status:'ready'}).select('*').maybeSingle();
       if(ins.error)throw ins.error;
       toast('Gravação salva. Você pode publicá-la depois.');renderLiveRecordings();
       resolve(ins.data);
     }catch(e){
       console.error('CMNT recording upload',e);
       toast('A gravação terminou, mas não foi possível salvá-la: '+(e.message||e),true);
       resolve(null);
     }finally{
       CMNT_LIVE.recorder=null;CMNT_LIVE.recordingChunks=[];CMNT_LIVE.recordingStartedAt=null;
     }
   };
   try{rec.stop()}catch(e){CMNT_LIVE.recorder=null;resolve(null)}
 });
}

  ["Desenho metodológico","Estudos podem combinar métodos quantitativos, qualitativos, observacionais, experimentais, documentais ou mistos. A escolha do método deve seguir a pergunta, e não o contrário. Amostra, critérios de inclusão, instrumentos, procedimento, variáveis, análise e limitações devem ficar documentados."],
  ["Rigor e reprodutibilidade","Resultados devem ser acompanhados de contexto, versão do instrumento, data de coleta, critérios de análise e limitações. Quando possível, materiais, instrumentos e dados anonimizados devem possuir identificação de versão para permitir auditoria e replicação."]
 ]},
 researcher:{title:"Pesquisador",kicker:"PERFIL CIENTÍFICO",intro:"Área destinada à identidade científica e ao acompanhamento das contribuições de pesquisadores, docentes, profissionais e colaboradores do ecossistema.",blocks:[
  ["Identidade","O perfil científico pode reunir área de atuação, formação, linhas de pesquisa, produção, projetos, participação em comunidades e vínculos institucionais informados pelo próprio pesquisador."],
  ["Contribuições","Uma contribuição pode ser artigo, relatório, instrumento, conjunto de dados, metodologia, material educacional, parecer, revisão ou participação em projeto. A plataforma deve diferenciar autoria, colaboração, curadoria e participação técnica."],
  ["Integridade","Conflitos de interesse, fontes de financiamento, limitações e relações institucionais devem ser declarados quando relevantes para a interpretação de um trabalho."]
 ]},
 evidence:{title:"Evidências",kicker:"AVALIAÇÃO DO CONHECIMENTO",intro:"A área de evidências ensina a diferenciar experiência pessoal, informação técnica, estudo científico, revisão, dado observacional e conclusão ainda não estabelecida.",blocks:[
  ["Níveis de confiança","Uma evidência não é forte apenas porque parece convincente. Deve-se observar desenho do estudo, qualidade da medida, tamanho e composição da amostra, controle de vieses, consistência com outros trabalhos, transparência do método e limites da generalização."],
  ["Leitura crítica","Pergunte: qual é a pergunta? Quem foi estudado? Como os dados foram obtidos? O resultado é associação ou causalidade? Quais fatores podem explicar o achado? O resultado foi replicado? O que o próprio estudo reconhece como limitação?"],
  ["Classificação na rede","Publicações podem ser identificadas como experiência, opinião, informação técnica ou evidência científica. A classificação não transforma automaticamente um conteúdo em evidência: ela apenas organiza o tipo de afirmação para que o leitor saiba como interpretá-la."]
 ]},
 nexus12:{title:"NEXUS 12",kicker:"PROGRESSÃO DE COMPETÊNCIAS HUMANAS",intro:"O NEXUS 12 é uma jornada de desenvolvimento humano aplicada à mobilidade. Cada pilar representa uma competência que pode ser ensinada, praticada, observada e retomada ao longo da vida.",blocks:[
  ["1 · Consciência Situacional","Perceber o ambiente, identificar mudanças relevantes e manter atenção distribuída sem perder o foco da tarefa. Inclui leitura de via, clima, tráfego, usuários vulneráveis, comportamento de outros agentes e mudanças inesperadas."],
  ["2 · Percepção de Risco","Reconhecer perigos antes que se convertam em eventos. Envolve antecipação, avaliação de probabilidade e gravidade, leitura de sinais e identificação de situações em que a margem de segurança está diminuindo."],
  ["3 · Tomada de Decisão","Escolher a alternativa mais segura diante de informação incompleta, pressão de tempo e múltiplas possibilidades. Inclui reconhecer quando reduzir velocidade, interromper uma manobra, esperar ou pedir ajuda."],
  ["4 · Controle Veicular","Integrar domínio do veículo, trajetória, velocidade, distância e resposta às condições da via. A competência é tratada como meio para preservar margem de segurança, não como demonstração de desempenho."],
  ["5 · Comunicação Eficaz","Usar sinais, linguagem, posicionamento e interação social para reduzir ambiguidades. Inclui comunicação com pedestres, ciclistas, motociclistas, motoristas, passageiros, instrutores e equipes de emergência."],
  ["6 · Regulamentação e Legislação","Compreender regras de circulação, responsabilidades, limites legais e consequências. A competência não se resume a memorizar normas: exige aplicar a regra ao contexto real e compreender sua finalidade de proteção."],
  ["7 · Adaptação e Flexibilidade","Modificar comportamento diante de clima, infraestrutura, fluxo, tecnologia, mudanças fisiológicas, alterações emocionais e eventos inesperados. Segurança exige capacidade de abandonar um plano quando o contexto muda."],
  ["8 · Inteligência Emocional","Reconhecer estados emocionais que podem interferir na percepção, decisão e interação. Inclui autorregulação, tolerância à frustração, empatia e capacidade de evitar escaladas de conflito."],
  ["9 · Responsabilidade Social","Compreender que cada decisão individual produz efeitos sobre outras pessoas. Inclui proteção de usuários vulneráveis, respeito, cooperação e rejeição de comportamentos que transferem risco para terceiros."],
  ["10 · Aprendizagem Contínua","Revisar hábitos, incorporar novos conhecimentos, reconhecer erros e transformar experiências em melhoria. A formação não termina na habilitação: ela acompanha mudanças de contexto, tecnologia e conhecimento."],
  ["11 · Ergonomia e Conforto","Relacionar postura, fadiga, atenção, ajuste do veículo, pausas, acessibilidade e condições físicas à segurança. Conforto aqui é uma variável funcional que ajuda a preservar capacidade de decisão e controle."],
  ["12 · Primeiros Socorros e Reação a Acidentes","Saber proteger a cena, acionar recursos adequados, comunicar informações relevantes e evitar intervenções que possam agravar uma lesão. A prioridade é preservar vida e segurança até a chegada do atendimento especializado."]
 ]},
 hsi:{title:"HSI",kicker:"HUMAN SAFETY INDEX",intro:"O HSI organiza a leitura do fator humano na segurança. No CMNT, ele deve ser compreendido como um sistema de avaliação e desenvolvimento, e não como rótulo definitivo sobre uma pessoa.",blocks:[
  ["O que é HSI","O Human Safety Index procura integrar dimensões cognitivas, emocionais, comportamentais, sociais e contextuais que influenciam decisões de segurança. O resultado deve ser interpretado no contexto, com transparência sobre instrumento, amostra, finalidade e limitações."],
  ["HSI-DOTH-P","O HSI-DOTH-P é o instrumento aprofundado utilizado nesta camada para observar cinco eixos: Decisão, Organização, Tempo, Humanização e Psicocomportamental. O questionário abaixo é uma implementação digital do instrumento e não deve ser tratado como diagnóstico clínico ou psicológico."],
  ["Como interpretar","O resultado indica um perfil de atenção e desenvolvimento no momento da resposta. Pontuações mais baixas apontam áreas que merecem reflexão e desenvolvimento; não significam incapacidade, transtorno ou culpa. Para pesquisa formal, o instrumento deve seguir protocolo, consentimento, critérios de amostragem e validação próprios."]
 ]},
 academy:{title:"Academia ENAT",kicker:"FORMAÇÃO E DIFUSÃO",intro:"A Academia ENAT transforma conhecimento científico em experiências de aprendizagem aplicadas ao trânsito.",blocks:[
  ["Formação","Conteúdos podem ser organizados em aulas, apostilas, atividades práticas, estudos de caso, exercícios reflexivos e avaliações formativas. O foco é transformar informação em competência observável."],
  ["Instrutor","O instrutor atua como mediador entre ciência e realidade. Deve contextualizar o conteúdo, estimular pensamento crítico, observar comportamento e evitar transformar uma pontuação isolada em julgamento da pessoa."],
  ["Ciclo de aprendizagem","Conhecer → praticar → observar → refletir → corrigir → repetir. A aprendizagem contínua é incorporada ao NEXUS 12 e pode dialogar com resultados do HSI-DOTH-P."]
 ]},
 observatory:{title:"Observatório",kicker:"MONITORAMENTO DO TRÂNSITO HUMANO",intro:"O Observatório acompanha sinais, indicadores e tendências para apoiar pesquisa, educação e tomada de decisão.",blocks:[
  ["Indicadores","Podem ser acompanhados indicadores de percepção de risco, comportamento, participação, formação, ocorrências relatadas, temas de discussão e evolução dos instrumentos. Indicadores devem sempre apresentar período, população, fonte e limitações."],
  ["Leitura responsável","Um aumento ou queda em um indicador não explica sozinho uma causa. O Observatório deve separar descrição, hipótese e conclusão, permitindo que pesquisadores revisem interpretações."],
  ["Painéis","Os painéis científicos devem privilegiar agregação e anonimização. Informações individuais somente devem ser utilizadas quando houver finalidade legítima, controle de acesso e base adequada para o tratamento."]
 ]},
 events:{title:"Eventos",kicker:"CIÊNCIA EM MOVIMENTO",intro:"Eventos aproximam pesquisadores, instrutores, gestores, profissionais e comunidades.",blocks:[
  ["Seminários","Espaço para apresentar estudos, métodos, resultados preliminares, limitações e perguntas abertas."],
  ["Oficinas","Atividades práticas para transformar conceitos de percepção de risco, tomada de decisão, comunicação e humanização em exercícios observáveis."],
  ["Registro científico","Cada evento pode guardar programação, participantes, materiais, gravações, resultados e encaminhamentos, permitindo rastreabilidade do conhecimento produzido."]
 ]},
 editorial:{title:"Editorial",kicker:"CURADORIA E PUBLICAÇÃO",intro:"A área editorial organiza artigos, notícias, ensaios, pesquisas e materiais de divulgação científica.",blocks:[
  ["Fluxo editorial","Recepção → triagem → classificação → revisão → decisão editorial → publicação → atualização. O fluxo deve deixar claro quando um material é opinião, divulgação, relatório técnico ou produção científica."],
  ["Transparência","Alterações relevantes devem manter histórico de versão. Correções devem ser registradas de maneira visível e não apagar a existência de uma versão anterior sem justificativa."],
  ["Linguagem","Conteúdo científico deve ser acessível sem perder precisão. Afirmações fortes exigem evidências proporcionais; hipóteses devem ser apresentadas como hipóteses."]
 ]},
 scientific_communities:{title:"Comunidades científicas",kicker:"COLABORAÇÃO",intro:"Comunidades científicas conectam pessoas em torno de perguntas, métodos, temas e projetos.",blocks:[
  ["Temas","As comunidades podem reunir pesquisadores de mobilidade, neurociência, educação, psicologia, ergonomia, engenharia, direito, saúde pública, políticas públicas e áreas correlatas."],

 institutions:{title:"Instituições",kicker:"REDE INSTITUCIONAL",intro:"A camada institucional permite mapear organizações, universidades, centros de pesquisa, órgãos públicos, empresas e entidades da sociedade civil relacionadas à mobilidade.",blocks:[

 ]},
 governance:{title:"Governança",kicker:"INTEGRIDADE E RESPONSABILIDADE",intro:"A governança define como ciência, dados, pessoas e decisões são protegidos dentro do ecossistema.",blocks:[

 knowledge_base:{title:"Base de conhecimento",kicker:"MEMÓRIA CIENTÍFICA",intro:"A base de conhecimento organiza conceitos, definições, referências, protocolos, instrumentos, glossários e materiais de apoio.",blocks:[

 neurodrive:{title:"NeuroDrive",kicker:"SISTEMA PROFISSIONAL PARA INSTRUTORES",intro:"O NeuroDrive é o ambiente profissional de gestão da atividade do instrutor. Na Rede Neurotrânsito, ele aparece como produto e acesso ao sistema; os seis cursos oficiais ficam organizados na Academia ENAT.",blocks:[

 scientific_ai:{title:"IA científica",kicker:"INTELIGÊNCIA ARTIFICIAL COM RESPONSABILIDADE",intro:"A IA científica pode ajudar a organizar literatura, comparar conceitos, localizar padrões e apoiar análise, mas não substitui método, revisão humana ou responsabilidade científica.",blocks:[

async function loadCmntData(key){
 var box=document.getElementById('cmntData');if(!box)return;
 var q=null;
 if(key==="research_lab")q=db.from('cmnt_research_projects').select('id,title,abstract,study_type,status,ethics_status,updated_at').neq('status','archived').order('updated_at',{ascending:false}).limit(20);
 else if(key==="researcher")q=db.from('cmnt_researcher_profiles').select('user_id,professional_summary,scientific_bio,research_areas,institutions,researcher_status,verification_status,orcid,lattes_url').order('updated_at',{ascending:false}).limit(20);
 else if(key==="evidence")q=db.from('cmnt_scientific_sources').select('id,title,source_type,authors,journal,publication_year,doi,evidence_level,review_status,url,abstract').neq('review_status','rejected').order('publication_year',{ascending:false}).limit(30);
 else if(key==="academy")q=db.from('enat_courses').select('id,name,code,nature,modality,summary,category,hours,slug,thumbnail_url').eq('active',true).eq('published',true).order('name').limit(20);
 else if(key==="observatory")q=db.from('cmnt_observatory_indicators').select('id,code,name,description,unit,source_domain,public_level').eq('active',true).order('name');
 else if(key==="events")q=db.from('cmnt_events').select('id,title,description,event_type,starts_at,ends_at,location,online_url,status,published').eq('published',true).order('starts_at',{ascending:true}).limit(30);
 else if(key==="editorial")q=db.from('cmnt_editorial_articles').select('id,title,summary,body,article_type,published_at,slug').eq('status','published').order('published_at',{ascending:false}).limit(20);
 else if(key==="scientific_communities")q=db.from('cmnt_community_templates').select('id,name,purpose,scope,active').eq('active',true).order('name');
 else if(key==="institutions")q=db.from('cmnt_institutions').select('id,name,acronym,institution_type,country,state,city,website,description,verified').order('name').limit(30);
 else if(key==="governance")q=db.from('cmnt_national_partnerships').select('id,name,partnership_type,scope,status,contact_notes').order('name').limit(30);
 else if(key==="knowledge_base")q=db.from('cmnt_knowledge_items').select('id,title,summary,item_type,related_competencies,updated_at').eq('status','published').order('updated_at',{ascending:false}).limit(30);
 else if(key==="integrations")q=db.from('cmnt_integration_links').select('id,source_system,source_record_id,target_type,target_record_id,relation_type,metadata,created_at').order('created_at',{ascending:false}).limit(50);
 else if(key==="scientific_ai")q=db.from('cmnt_ai_interactions').select('id,context_type,input_summary,output_summary,source_count,human_review_required,reviewed,created_at').eq('reviewed',true).order('created_at',{ascending:false}).limit(20);
 else return;
 var r=await q;if(r.error){box.innerHTML='<div class="card rounded-3xl p-5 bg-red-50 text-red-700"><b>Não foi possível carregar este módulo.</b><p class="mt-2 text-sm">'+esc(r.error.message)+'</p></div>';return}
 var rows=r.data||[];
 var html='';
 if(key==="academy")html=rows.map(function(x){return cmntDynamicCard(x.name,x.summary,(x.hours?x.hours+' h · ':'')+(x.category||x.nature||'ENAT'))}).join('');
 else if(key==="researcher")html=rows.map(function(x){return cmntDynamicCard((x.research_areas||[]).slice(0,2).join(' · ')||'Pesquisador ENAT',x.professional_summary||x.scientific_bio,(x.verification_status||'unverified'))}).join('');
 else if(key==="evidence")html=rows.map(function(x){return cmntDynamicCard(x.title,x.abstract,(x.evidence_level||'não classificado')+' · '+(x.publication_year||'s/ano'))}).join('');
 else if(key==="observatory")html=rows.map(function(x){return cmntDynamicCard(x.name,x.description,(x.code||'')+' · '+(x.unit||'índice'))}).join('');
 else if(key==="events")html=rows.map(function(x){return cmntDynamicCard(x.title,x.description,new Date(x.starts_at).toLocaleString('pt-BR')+' · '+(x.event_type||'evento'))}).join('');
 else if(key==="editorial")html=rows.map(function(x){return cmntDynamicCard(x.title,x.summary||x.body,(x.article_type||'artigo'))}).join('');
 else if(key==="scientific_communities")html=rows.map(function(x){return cmntDynamicCard(x.name,x.purpose||x.scope,'comunidade científica')}).join('');
 else if(key==="institutions")html=rows.map(function(x){return cmntDynamicCard((x.acronym?x.acronym+' — ':'')+x.name,x.description,(x.city||'')+(x.state?'/'+x.state:'')+(x.verified?' · verificada':''))}).join('');
 else if(key==="governance")html=rows.map(function(x){return cmntDynamicCard(x.name,x.scope||x.contact_notes,(x.partnership_type||'parceria')+' · '+(x.status||''))}).join('');
 else if(key==="knowledge_base")html=rows.map(function(x){return cmntDynamicCard(x.title,x.summary,(x.item_type||'conhecimento'))}).join('');
 else if(key==="integrations")html=rows.map(function(x){return cmntDynamicCard(x.source_system+' → '+x.target_type,x.relation_type+' · registro '+x.source_record_id,(x.created_at?new Date(x.created_at).toLocaleDateString('pt-BR'):''))}).join('');
 else if(key==="scientific_ai")html=rows.map(function(x){return cmntDynamicCard(x.context_type,x.output_summary||x.input_summary,(x.source_count||0)+' fontes'+(x.human_review_required?' · revisão humana':''))}).join('');
 else html=rows.map(function(x){return cmntDynamicCard(x.title,x.abstract,x.study_type+' · '+x.status+' · ética: '+x.ethics_status)}).join('');
 if(key==="integrations"){ html+=await cmntNeuroDriveCatalog(); }
 if(key==="observatory" && rows.length){
   var d=await db.from('cmnt_observatory_data').select('indicator_id,period_start,period_end,geography_level,geography_code,value,sample_size,quality_status,provenance').eq('published',true).order('period_end',{ascending:false}).limit(30);
   if(!d.error && d.data&&d.data.length)html+='<div class="card rounded-3xl p-5"><h3 class="text-lg font-black">Dados publicados</h3><div class="mt-3 space-y-2">'+d.data.map(function(x){return'<div class="flex justify-between gap-3 p-3 rounded-xl bg-slate-50"><span class="text-sm">'+esc(x.geography_level||'nacional')+' '+esc(x.geography_code||'')+' · '+esc(x.period_start)+' a '+esc(x.period_end)+'</span><b>'+Number(x.value).toLocaleString('pt-BR')+'</b></div>'}).join('')+'</div></div>';
 }
 if(!html)html='<div class="card rounded-3xl p-8 text-center text-slate-500">Nenhum registro publicado disponível neste módulo ainda. O módulo está conectado ao banco e pronto para receber dados pelo Portal Administrativo.</div>';
 box.innerHTML='<div class="grid md:grid-cols-2 gap-4">'+html+'</div>';
}

/* ===== CMNT ACADEMIA CIENTÍFICA — TRILHAS, AULAS E QUESTIONÁRIOS ===== */
const CMNT_COURSES={
 research_lab:{goal:"Aprender a transformar problemas reais de mobilidade em perguntas pesquisáveis, desenhos metodológicos e registros auditáveis.",lessons:[
  ["Aula 1 — Da situação-problema à pergunta","Comece pelo fenômeno observado, delimite população, contexto, período e variável de interesse. Uma boa pergunta reduz ambiguidades e permite decidir quais dados serão necessários. Evite perguntas que já tragam a conclusão embutida.","Objetivo: formular uma pergunta clara, delimitada e verificável."],
  ["Aula 2 — Desenho metodológico","Escolha entre métodos quantitativos, qualitativos, observacionais, documentais ou mistos conforme a pergunta. Registre amostra, critérios de inclusão, instrumentos, procedimento, variáveis, análise e limitações antes de interpretar resultados.","Objetivo: justificar o método a partir da pergunta, e não adaptar a pergunta ao método disponível."],
  ["Aula 3 — Rigor, ética e reprodutibilidade","Versione instrumentos, registre decisões metodológicas, preserve rastreabilidade das fontes e documente limitações. Quando houver pessoas, o desenho deve considerar consentimento, privacidade, minimização de dados e finalidade definida.","Objetivo: produzir pesquisa que possa ser compreendida, auditada e, quando possível, reproduzida."]
 ],activity:"Escreva uma pergunta de pesquisa sobre segurança viária e defina população, contexto, variável principal, método e uma limitação provável."},
 researcher:{goal:"Construir uma identidade científica responsável e compreender diferentes formas de contribuição para a produção do conhecimento.",lessons:[
  ["Aula 1 — Identidade científica","Um perfil científico deve apresentar área de atuação, formação, linhas de pesquisa, projetos e produção sem transformar credenciais em argumento de autoridade. A qualidade de uma afirmação depende de evidências e método.","Objetivo: apresentar trajetória sem confundir currículo com validade científica."],
  ["Aula 2 — Autoria e contribuição","Diferencie autoria, colaboração, curadoria, participação técnica, orientação e financiamento. Registre quem fez o quê e preserve créditos adequados em artigos, instrumentos, bases de dados e materiais educacionais.","Objetivo: reconhecer contribuições de forma transparente."],
  ["Aula 3 — Integridade e conflitos de interesse","Financiamento, vínculos institucionais, interesses comerciais e relações pessoais podem ser relevantes para interpretar um resultado. Declarar conflitos não invalida automaticamente um estudo; aumenta a transparência para sua avaliação.","Objetivo: aprender a declarar contexto e potenciais conflitos."]
 ],activity:"Monte um mini perfil científico com área, três linhas de interesse, duas contribuições e um possível conflito de interesse que deveria ser declarado."},
 evidence:{goal:"Aprender a avaliar a força de uma afirmação antes de aceitá-la, compartilhá-la ou utilizá-la em decisões.",lessons:[
  ["Aula 1 — O que conta como evidência","Experiência pessoal, opinião, informação técnica, dado observacional, estudo científico e revisão sistemática são formas diferentes de conhecimento. O rótulo não determina sozinho a qualidade; método, transparência e coerência importam.","Objetivo: identificar o tipo de afirmação e o tipo de fonte."],
  ["Aula 2 — Associação não é causalidade","Quando duas variáveis variam juntas, isso não prova que uma causou a outra. Considere causalidade reversa, variáveis de confusão, seleção da amostra, viés de medição e explicações alternativas.","Objetivo: separar correlação, associação, hipótese e causalidade."],
  ["Aula 3 — Leitura crítica","Pergunte quem foi estudado, como foi medido, qual o tamanho e composição da amostra, quais controles existiram, quais resultados foram encontrados e quais limitações foram reconhecidas pelos autores.","Objetivo: criar um roteiro simples de leitura crítica."]
 ],activity:"Escolha uma afirmação sobre trânsito e escreva: fonte, tipo de evidência, método, possível viés, limite de generalização e o que ainda precisaria ser verificado."},
 academy:{goal:"Transformar conhecimento sobre mobilidade e comportamento humano em experiências de aprendizagem observáveis e seguras.",lessons:[
  ["Aula 1 — Aprendizagem por competência","Informação é o ponto de partida. Competência exige compreender, praticar, observar, receber feedback e repetir em contextos diferentes. A avaliação deve verificar desenvolvimento, não apenas memorização.","Objetivo: planejar uma aprendizagem orientada a competência."],
  ["Aula 2 — Papel do instrutor","O instrutor contextualiza ciência, cria situações de prática, observa comportamento e conduz reflexão. Deve evitar humilhação, rótulos e interpretações clínicas fora de sua competência.","Objetivo: usar feedback descritivo, específico e orientado à melhoria."],
  ["Aula 3 — Avaliação formativa","Use situações-problema, estudos de caso, perguntas reflexivas e observação estruturada. Resultados devem indicar o próximo passo de aprendizagem, e não apenas uma nota final.","Objetivo: transformar avaliação em instrumento de desenvolvimento."]
 ],activity:"Crie uma atividade de 20 minutos para ensinar percepção de risco: objetivo, situação-problema, tarefa do aluno, critérios de observação e feedback."},
 observatory:{goal:"Aprender a operar um Observatório de Trânsito Humano com método: definir indicadores, construir séries, interpretar mudanças com contexto, avaliar qualidade dos dados e transformar evidências em decisões responsáveis.",lessons:[
 ["Aula 1 — Arquitetura de Indicadores do Observatório","Um indicador é uma representação operacional de um fenômeno. Para ser útil, precisa responder claramente o que está sendo medido, em quem, onde, quando e por qual método. Esta aula aborda definição operacional, população-alvo, unidade de análise, numerador e denominador quando aplicáveis, fórmula, fonte, periodicidade, metadados, critérios de qualidade e limitações. Também diferencia indicador absoluto, taxa, proporção, índice e escore. Um indicador só pode ser comparado quando suas definições e condições de produção são suficientemente compatíveis.","Objetivo: construir uma ficha técnica de indicador que permita compreender, reproduzir e auditar sua produção."],
 ["Aula 2 — Séries Temporais, Tendências e Contexto","Observar uma mudança ao longo do tempo exige mais do que comparar dois números. É necessário verificar período de referência, sazonalidade, tamanho da população, mudanças no processo de coleta, alterações de cobertura, mudanças normativas, eventos extraordinários e qualidade dos registros. Tendência descreve um padrão observado; não prova sua causa. Nesta aula, o pesquisador aprende a separar dado observado, hipótese explicativa e conclusão sustentada, além de reconhecer variação aleatória, rupturas de série e possíveis vieses de seleção ou registro.","Objetivo: interpretar tendências do trânsito humano sem atribuir causalidade sem evidência suficiente."],
 ["Aula 3 — Governança, Ética e Inteligência para Decisão","Um Observatório deve produzir inteligência sem transformar monitoramento em vigilância indiscriminada. A aula aborda agregação, anonimização, minimização de dados, controle de acesso, finalidade, rastreabilidade da fonte, qualidade, transparência metodológica e comunicação responsável. Também mostra como transformar indicadores em perguntas para gestores, pesquisadores e educadores, evitando rankings simplistas e interpretações que estigmatizem pessoas ou territórios. O produto final do Observatório deve permitir saber o que foi observado, como foi medido, quais são os limites e que decisão pode ser apoiada pela evidência.","Objetivo: construir painéis e análises que sejam tecnicamente úteis, eticamente proporcionais e auditáveis."]
 ],activity:"Escolha um indicador de segurança viária e produza sua ficha técnica: nome, definição operacional, fórmula, população, unidade, fonte, período, periodicidade, nível geográfico, critérios de qualidade e pelo menos três limitações. Depois escreva uma interpretação que diferencie claramente descrição, hipótese e conclusão."},
events:{goal:"Planejar eventos que produzam aprendizagem, colaboração e registro científico além da simples realização do encontro.",lessons:[
  ["Aula 1 — Arquitetura do evento","Defina objetivo, público, problema central, formato, facilitadores, materiais e resultado esperado. Seminário, oficina, mesa técnica e congresso têm objetivos diferentes.","Objetivo: alinhar formato ao resultado esperado."],
  ["Aula 2 — Aprendizagem ativa","Inclua perguntas, estudos de caso, demonstrações, grupos de trabalho e síntese final. Participação ativa aumenta a possibilidade de transformar informação em compreensão aplicada.","Objetivo: desenhar uma experiência participativa."],
  ["Aula 3 — Memória do evento","Registre programação, materiais, participantes autorizados, gravações quando aplicável, decisões, perguntas abertas e encaminhamentos. O evento torna-se uma fonte de conhecimento quando possui memória organizada.","Objetivo: criar rastreabilidade pós-evento."]
 ],activity:"Monte o roteiro de uma oficina sobre comportamento seguro com objetivo, três atividades e um produto final."},
 editorial:{goal:"Aprender a produzir e revisar conteúdo científico e de divulgação com clareza, rastreabilidade e proporcionalidade entre afirmação e evidência.",lessons:[
  ["Aula 1 — Tipos de publicação","Diferencie notícia, opinião, ensaio, artigo científico, revisão, relatório técnico, nota metodológica e material educativo. Cada gênero tem exigências diferentes.","Objetivo: classificar corretamente o que está sendo publicado."],
  ["Aula 2 — Revisão e fontes","Verifique afirmações, datas, autores, referências e contexto. Não use uma fonte secundária como se fosse a fonte primária quando a primária estiver disponível.","Objetivo: construir uma cadeia de referência confiável."],
  ["Aula 3 — Correções e versões","Uma publicação pode ser atualizada, mas mudanças relevantes devem ser registradas. Correções devem ser transparentes e não apagar silenciosamente o histórico editorial.","Objetivo: preservar memória e confiança."]
 ],activity:"Pegue um texto sobre trânsito e transforme-o em uma nota de divulgação científica com título, resumo, três evidências e uma seção de limitações."},
 scientific_communities:{goal:"Aprender a formar comunidades científicas colaborativas, plurais e capazes de transformar debate em produção organizada.",lessons:[
  ["Aula 1 — Comunidade e propósito","Uma comunidade precisa de pergunta, tema ou finalidade compartilhada. Defina público, escopo, regras de convivência, formas de contribuição e critérios para conteúdos destacados.","Objetivo: criar uma comunidade com propósito verificável."],
  ["Aula 2 — Debate científico","Crítica deve se dirigir a ideias, métodos e evidências, não à dignidade da pessoa. Discordâncias podem ser registradas como hipóteses concorrentes e comparadas por critérios explícitos.","Objetivo: praticar discordância produtiva."],
  ["Aula 3 — Produção colaborativa","Discussões podem gerar protocolos, revisões, projetos, eventos, bases de referências e recomendações. Registre decisões e responsáveis para que colaboração não dependa apenas da memória individual.","Objetivo: converter conversa em produto científico."]
 ],activity:"Defina uma comunidade científica: nome, pergunta central, público, três regras de convivência e dois produtos que ela deverá produzir."},
 institutions:{goal:"Compreender como universidades, órgãos públicos, empresas e organizações podem colaborar sem comprometer transparência e independência científica.",lessons:[
  ["Aula 1 — Tipos de vínculo","Instituições podem ser parceiras, financiadoras, executoras, fornecedoras de dados, campo de pesquisa ou disseminadoras. O papel de cada uma deve ser explicitado.","Objetivo: mapear responsabilidades institucionais."],
  ["Aula 2 — Independência e conflito","Financiamento ou parceria não invalida um estudo, mas precisa ser transparente. Critérios de análise, publicação e interpretação devem ser protegidos de interferências indevidas.","Objetivo: separar colaboração de controle indevido."],
  ["Aula 3 — Acordos e dados","Parcerias devem definir finalidade, responsabilidades, acesso, segurança, propriedade intelectual quando aplicável, publicação e encerramento do compartilhamento.","Objetivo: desenhar um vínculo institucional com regras claras."]
 ],activity:"Desenhe um acordo hipotético entre universidade e órgão público para estudar segurança viária, incluindo dados, responsabilidades e transparência."},
 governance:{goal:"Compreender como decisões, dados, instrumentos e responsabilidades devem ser governados para preservar integridade e confiança.",lessons:[
  ["Aula 1 — Princípios","Integridade, transparência, responsabilidade, proporcionalidade, segurança, privacidade, rastreabilidade e respeito à autonomia devem orientar decisões.","Objetivo: reconhecer princípios de governança científica."],
  ["Aula 2 — Ciclo de decisão","Mudanças importantes devem registrar responsável, justificativa, impacto, aprovação quando necessária e versão anterior. Isso permite compreender por que uma decisão foi tomada.","Objetivo: criar decisões auditáveis."],
  ["Aula 3 — Dados e acesso","Acesso deve ser proporcional à função. Nem todo administrador precisa ver todo dado. Logs, segregação de funções, retenção e descarte são componentes da governança.","Objetivo: aplicar o princípio do menor privilégio."]
 ],activity:"Crie uma regra de governança para um banco de avaliações HSI: quem acessa, para qual finalidade, quais registros são mantidos e quando o acesso deve ser revisto."},
 knowledge_base:{goal:"Aprender a organizar conhecimento para que conceitos, protocolos e referências possam ser encontrados, atualizados e auditados.",lessons:[
  ["Aula 1 — Unidade de conhecimento","Cada entrada deve possuir título, definição, contexto, fonte, palavras-chave, data de revisão e responsável. Evite duplicar conceitos com nomes diferentes sem explicitar a relação.","Objetivo: criar entradas reutilizáveis."],
  ["Aula 2 — Versionamento","Definições e protocolos mudam. Preserve versões, data de vigência e motivo da alteração. Isso permite saber qual conhecimento estava válido em determinado momento.","Objetivo: manter memória científica."],
  ["Aula 3 — Curadoria","Curadoria não é apenas acumular links. É selecionar, contextualizar, comparar e atualizar. Uma fonte antiga pode continuar relevante, mas deve ser apresentada com seu contexto temporal.","Objetivo: construir uma base viva e confiável."]
 ],activity:"Crie uma ficha de conhecimento sobre 'percepção de risco' com definição, aplicação no trânsito, fonte, palavras-chave e data de revisão."},
 integrations:{goal:"Compreender como a rede Neurotrânsito se integra aos cursos do NeuroDrive ENAT-HSI para transformar formação em aprendizagem aplicada ao trânsito, conectando conteúdo, competências, prática, reflexão e acompanhamento.",lessons:[
  ["Aula 1 — Neurotrânsito e NeuroDrive: uma formação conectada","O NeuroDrive é a camada formativa; a rede Neurotrânsito é o espaço de continuidade científica, social e prática. A integração permite que o aluno não apenas consuma um curso, mas relacione o conteúdo às situações reais da mobilidade: percepção de risco, tomada de decisão, comportamento, comunicação, responsabilidade e segurança. O CMNT deve funcionar como ponte entre o conhecimento estudado e a reflexão sobre sua aplicação no trânsito.","Objetivo: compreender como NeuroDrive e Neurotrânsito se complementam na formação do fator humano no trânsito."],
  ["Aula 2 — Do conteúdo do curso à competência no trânsito","Uma aula do NeuroDrive deve produzir mais do que informação memorizada. O conteúdo pode ser relacionado aos 12 pilares do NEXUS 12 e às dimensões de reflexão do HSI-DOTH-P. O instrutor observa situações concretas, identifica competências mobilizadas, fornece feedback e estimula o aluno a compreender por que determinada decisão é mais segura. A rede Neurotrânsito amplia esse processo com conteúdos científicos, comunidades, discussões e registros de aprendizagem.","Objetivo: transformar conteúdos do NeuroDrive em competências observáveis e aplicáveis à mobilidade."],
  ["Aula 3 — Acompanhamento, prática e evolução do aluno","A integração acompanha o ciclo diagnóstico → interpretação → intervenção → transformação. O aluno estuda no NeuroDrive, relaciona o conhecimento às situações de trânsito, pratica, recebe feedback e pode retomar conteúdos para corrigir lacunas. O objetivo não é rotular o condutor, mas identificar oportunidades de aprendizagem e desenvolvimento. Indicadores, questionários e registros devem apoiar a reflexão pedagógica, respeitando contexto, finalidade, privacidade e limites metodológicos.","Objetivo: utilizar a integração NeuroDrive–Neurotrânsito para acompanhar evolução e planejar intervenções pedagógicas responsáveis."]
 ],activity:"Escolha uma situação real de trânsito — por exemplo, aproximação de faixa de pedestres, mudança de faixa, condução sob chuva ou interação com motociclista — e relacione-a a um conteúdo do NeuroDrive, a dois pilares do NEXUS 12 e a uma estratégia de intervenção pedagógica."},
 neurodrive:{goal:"Curso específico sobre o NeuroDrive ENAT-HSI e sua aplicação à formação humana para o trânsito, conectando neuroeducação, prática do instrutor, NEXUS 12, HSI-DOTH-P e segurança viária.",lessons:[
 ["Aula 1 — Fundamentos do NeuroDrive aplicado ao trânsito","O NeuroDrive organiza a aprendizagem para que o instrutor consiga trabalhar não apenas regras e técnicas, mas também os processos humanos envolvidos na condução. Atenção, percepção, emoção, tomada de decisão, autorregulação e responsabilidade interferem na forma como o condutor interpreta o ambiente e responde aos riscos. O NeuroDrive deve ser compreendido como apoio pedagógico: o instrutor continua responsável por contextualizar o conteúdo, observar o aluno e transformar conhecimento em comportamento seguro.","Objetivo: compreender o NeuroDrive como metodologia de apoio à formação do fator humano na condução."],
 ["Aula 2 — Neuroeducação, NEXUS 12 e comportamento seguro","A aprendizagem no trânsito precisa sair da memorização e chegar à competência. Os 12 pilares do NEXUS 12 permitem organizar essa passagem: consciência situacional, percepção de risco, decisão, controle, comunicação, legislação, adaptação, inteligência emocional, responsabilidade social, aprendizagem contínua, ergonomia e primeiros socorros. O NeuroDrive pode apresentar conceitos e situações; o instrutor cria oportunidades para que o aluno perceba, decida, execute, receba feedback e reflita sobre suas escolhas.","Objetivo: conectar conteúdos do NeuroDrive às competências observáveis do NEXUS 12."],
 ["Aula 3 — HSI-DOTH-P, feedback e evolução do condutor","O HSI-DOTH-P pode apoiar uma reflexão estruturada sobre decisão, organização, tempo, humanização e aspectos psicocomportamentais. Em conjunto com o NeuroDrive, essas referências ajudam a transformar observações da formação em perguntas pedagógicas: o aluno percebeu o risco? organizou sua resposta? administrou o tempo? considerou outras pessoas? regulou seu comportamento? A finalidade é orientar feedback e desenvolvimento, não produzir diagnóstico clínico ou rótulo permanente.","Objetivo: utilizar HSI-DOTH-P e NeuroDrive para produzir feedback, intervenção e acompanhamento responsáveis."]
 ],activity:"Selecione uma situação de condução e construa uma mini-intervenção NeuroDrive: conteúdo a estudar, competência NEXUS 12 relacionada, comportamento observável, pergunta de reflexão, feedback do instrutor e evidência de evolução."},
scientific_ai:{goal:"Usar inteligência artificial como apoio científico sem terceirizar julgamento, validação, autoria ou responsabilidade.",lessons:[
  ["Aula 1 — O que a IA pode fazer","A IA pode apoiar busca, classificação, síntese preliminar, geração de perguntas, organização de referências e exploração de grandes volumes de texto. Ela não transforma automaticamente uma hipótese em evidência.","Objetivo: escolher usos adequados."],
  ["Aula 2 — Erros e vieses","Modelos podem inventar referências, omitir contexto, reproduzir vieses ou apresentar uma resposta plausível como se fosse certa. Toda saída relevante deve ser conferida na fonte e no contexto original.","Objetivo: desenvolver verificação humana."],
  ["Aula 3 — Rastreabilidade","Registre finalidade, ferramenta, versão quando disponível, dados utilizados, papel humano e limites. Em pesquisa, a contribuição da IA deve ser descrita de maneira proporcional.","Objetivo: documentar uso responsável de IA."]
 ],activity:"Use uma IA para gerar três hipóteses sobre segurança viária e depois escreva quais fontes e dados seriam necessários para verificar cada uma."}

const CMNT_NEXUS_DETAILS=[
 ["Consciência Situacional",
  "Consciência situacional é a capacidade de perceber o que acontece ao redor, compreender o significado dos sinais e antecipar como a situação pode evoluir. No trânsito, não basta olhar: é necessário selecionar informações relevantes, atualizar o cenário continuamente e reconhecer usuários vulneráveis, mudanças de fluxo, obstáculos, clima, infraestrutura e comportamentos inesperados.",
  "Faça uma varredura em camadas: ambiente distante, zona de conflito e área imediatamente à frente. Em uma situação real, descreva cinco elementos observáveis, indique quais podem mudar nos próximos segundos e explique como cada um influencia sua margem de segurança.",
  "O que diferencia perceber de compreender uma situação?",
  "Perceber é captar sinais; compreender é interpretar sua relevância e antecipar possíveis mudanças.",
  "Desenvolver esta competência significa ampliar a leitura do ambiente sem produzir excesso de informação. A atenção precisa ser seletiva: priorizar aquilo que pode alterar trajetória, velocidade, prioridade, distância ou comportamento. Uma boa consciência situacional também inclui reconhecer quando a própria atenção está degradada por fadiga, distração ou carga cognitiva.",
  "Exercício: durante uma deslocação segura, observe sem interferir na condução e registre ambiente, usuários, conflitos potenciais, mudanças e resposta preventiva. Depois compare o que você previu com o que realmente ocorreu.",
  "Ponto de atenção: uma percepção isolada não garante previsão correta. O cenário deve ser atualizado continuamente."
 ],
 ["Percepção de Risco",
  "Percepção de risco transforma sinais do ambiente em uma estimativa prática de perigo. Ela considera probabilidade, gravidade, exposição, vulnerabilidade e margem de segurança. Um mesmo evento pode representar riscos diferentes conforme velocidade, distância, visibilidade, condições da via, comportamento humano e possibilidade de resposta.",
  "Compare mentalmente uma mesma situação em condições secas e molhadas, com fluxo leve e intenso. Identifique quais variáveis aumentam exposição ou reduzem a capacidade de resposta e escolha medidas que ampliem a margem de segurança.",
  "Perceber risco significa apenas identificar um perigo?",
  "Não. É necessário interpretar contexto, exposição, probabilidade, gravidade e margem de segurança.",
  "O risco não é uma propriedade fixa de um objeto ou situação. Ele emerge da relação entre ameaça, exposição e capacidade de resposta. Por isso, a competência envolve antecipar consequências e reconhecer sinais precoces de deterioração da segurança. A percepção também pode sofrer influência de excesso de confiança, normalização do desvio, pressão social e experiências anteriores.",
  "Estudo de caso: escolha uma situação cotidiana de trânsito e construa uma matriz simples com ameaça, exposição, consequência possível, margem atual e ação preventiva.",
  "Ponto de atenção: não confunda familiaridade com segurança. Situações comuns também podem conter risco relevante."
 ],
 ["Tomada de Decisão",
  "Tomada de decisão é selecionar uma resposta segura diante de informação incompleta, pressão de tempo e alternativas concorrentes. Uma decisão competente preserva opções futuras, reduz risco desnecessário e considera consequências para outras pessoas. Esperar, reduzir velocidade ou abandonar uma manobra também são decisões.",
  "Diante de uma situação em que chegar mais rápido entra em conflito com preservar margem de segurança, compare pelo menos três alternativas, seus riscos e seus efeitos sobre terceiros. Escolha a alternativa que mantém maior capacidade de resposta.",
  "Qual é uma decisão segura sob incerteza?",
  "É aquela que evita risco desnecessário e preserva a maior margem de segurança possível.",
  "Decisões humanas são influenciadas por tempo, emoção, hábitos, pressão social e expectativas. No trânsito, uma estratégia robusta é reconhecer incerteza, evitar decisões irreversíveis quando a informação é insuficiente e preferir alternativas que mantenham possibilidades de correção. A competência inclui saber interromper um plano quando novas evidências aparecem.",
  "Exercício: para três situações hipotéticas, registre opções, consequência provável, risco para terceiros, reversibilidade e justificativa da decisão escolhida.",
  "Ponto de atenção: velocidade de decisão não é sinônimo de qualidade da decisão."
 ],
 ["Controle Veicular",
  "Controle veicular integra velocidade, trajetória, distância, posicionamento, comandos e leitura das condições do veículo e da via. Seu objetivo não é demonstrar habilidade, mas manter uma reserva de capacidade para responder a eventos inesperados. O controle deve ser proporcional ao ambiente e às condições humanas.",
  "Analise como reduzir velocidade, ampliar distância e escolher uma trajetória mais previsível pode aumentar as opções de resposta. Relacione a estratégia às condições de aderência, visibilidade, tráfego e estado do veículo.",
  "Para que serve o controle veicular no NEXUS 12?",
  "Para preservar estabilidade, previsibilidade e margem de resposta, e não para demonstrar desempenho.",
  "Controle eficiente depende da integração entre percepção, decisão e execução. Um veículo tecnicamente capaz não elimina limitações físicas nem erros humanos. Velocidade elevada reduz tempo disponível e pode ampliar consequências; postura inadequada, fadiga e manutenção deficiente também comprometem o controle.",
  "Checklist aplicado: antes de um deslocamento, verifique posição, visibilidade, condições do veículo, distância operacional e estratégia de velocidade adequada ao contexto.",
  "Ponto de atenção: domínio do veículo nunca deve ser usado para justificar manobras que aumentem risco."
 ],
 ["Comunicação Eficaz",
  "Comunicação no trânsito é a capacidade de tornar intenções compreensíveis e previsíveis. Ela envolve sinalização, posicionamento, velocidade, contato visual quando apropriado, linguagem verbal e não verbal. Comunicação eficaz reduz ambiguidades e facilita a cooperação entre diferentes usuários.",
  "Escolha uma manobra de mudança de direção ou deslocamento lateral e descreva como anunciar a intenção com antecedência, manter trajetória previsível e confirmar que a interação pode ocorrer com segurança.",
  "Qual é o principal objetivo da comunicação viária?",
  "Reduzir ambiguidades e permitir que os demais usuários antecipem a interação.",
  "Comunicar não significa apenas emitir um sinal; é necessário considerar se a mensagem pode ser percebida e interpretada corretamente. A comunicação também falha quando há agressividade, pressa, distração ou pressupostos sobre o comportamento alheio. Em ambientes compartilhados, previsibilidade é um componente de segurança.",
  "Exercício: observe três interações seguras e três ambiguidades em um ambiente de mobilidade. Explique como a comunicação poderia ser melhorada.",
  "Ponto de atenção: sinalizar uma intenção não concede automaticamente prioridade nem elimina a necessidade de verificar o ambiente."
 ],
 ["Regulamentação e Legislação",
  "Regulamentação e legislação estruturam expectativas de comportamento, responsabilidades e condições mínimas de circulação segura. Conhecer a regra é diferente de apenas memorizá-la: é preciso compreender sua finalidade, interpretar o contexto e aplicar corretamente os princípios de proteção e convivência.",
  "Escolha uma regra de circulação e explique três elementos: qual comportamento ela orienta, qual risco procura reduzir e quais responsabilidades surgem quando ela é aplicada.",
  "Memorizar uma regra garante aplicação segura?",
  "Não. É necessário compreender a finalidade e aplicar a regra ao contexto.",
  "A norma fornece uma estrutura comum, mas a realidade pode apresentar situações complexas. A competência envolve consultar fontes oficiais quando houver dúvida, reconhecer alterações normativas e não transformar interpretações pessoais em regra. Também exige distinguir responsabilidade legal de julgamento moral.",
  "Atividade: selecione uma norma de trânsito vigente, identifique sua fonte oficial, finalidade protetiva e um exemplo de aplicação contextual.",
  "Ponto de atenção: normas mudam. Conteúdo educacional deve ser atualizado e ter fonte identificável."
 ],
 ["Adaptação e Flexibilidade",
  "Adaptação é modificar comportamento quando o contexto muda. Chuva, neblina, obras, congestionamento, mudanças de infraestrutura, falhas do veículo, alterações fisiológicas ou emocionais e eventos inesperados podem tornar um plano inicial inadequado. Flexibilidade segura significa abandonar o plano quando necessário.",
  "Construa um plano principal e um plano alternativo para uma rota que pode ser bloqueada. Defina previamente quais sinais fariam você mudar de estratégia e quais limites não devem ser ultrapassados.",
  "Flexibilidade significa improvisar sem critérios?",
  "Não. Significa adaptar-se preservando objetivos, critérios e segurança.",
  "Pessoas tendem a manter planos mesmo quando as condições mudam, fenômeno relacionado à rigidez comportamental e ao custo percebido de abandonar uma intenção. A adaptação segura cria gatilhos de revisão antes que a situação se torne crítica. Tecnologia e infraestrutura também exigem atualização contínua das competências.",
  "Estudo de caso: descreva uma mudança inesperada no ambiente e escreva qual informação desencadearia sua mudança de plano.",
  "Ponto de atenção: adaptar-se não significa aceitar qualquer condição; pode significar interromper a atividade."
 ],
 ["Inteligência Emocional",
  "Inteligência emocional aplicada à mobilidade envolve reconhecer estados internos, regular respostas, compreender emoções de outras pessoas e evitar que frustração, medo, raiva ou euforia comprometam decisões. A competência não exige ausência de emoções, mas capacidade de agir com consciência delas.",
  "Identifique sinais físicos e cognitivos que indicariam aumento de tensão ou impulsividade. Para cada sinal, defina uma estratégia segura de pausa, afastamento do conflito ou retomada somente quando houver condições.",
  "Qual é uma finalidade da autorregulação?",
  "Evitar que estados emocionais comprometam decisões, percepção e relações.",
  "Emoções podem estreitar atenção, acelerar respostas e aumentar interpretações hostis. Reconhecer o estado emocional antes de agir cria uma oportunidade de interromper a escalada. Empatia também é funcional: compreender que outros usuários possuem limitações, pressões e perspectivas diferentes pode reduzir conflitos.",
  "Exercício reflexivo: registre uma situação de trânsito que gerou irritação, quais sinais apareceram, qual resposta ocorreu e qual estratégia poderia ser usada em uma situação semelhante.",
  "Ponto de atenção: inteligência emocional não significa diagnosticar o estado psicológico de outra pessoa."
 ],
 ["Responsabilidade Social",
  "Responsabilidade social significa reconhecer que decisões individuais afetam pessoas que compartilham o espaço de mobilidade. A segurança deve considerar pedestres, ciclistas, motociclistas, passageiros, trabalhadores, pessoas com deficiência, idosos, crianças e demais usuários vulneráveis.",
  "Analise uma situação em que uma vantagem individual — ganhar tempo, ocupar espaço ou impor uma preferência — poderia transferir risco para outra pessoa. Descreva uma alternativa cooperativa.",
  "Responsabilidade social no trânsito é apenas obedecer regras?",
  "Não. Também envolve cooperação, respeito, proteção de terceiros e consideração pelos usuários vulneráveis.",
  "Uma cultura de segurança não depende somente de fiscalização. Ela também é construída por normas sociais, empatia e responsabilidade compartilhada. O comportamento seguro considera efeitos indiretos e evita normalizar práticas que colocam terceiros em risco, mesmo quando parecem vantajosas individualmente.",
  "Atividade: identifique três grupos vulneráveis no seu contexto de mobilidade e proponha uma ação concreta para reduzir sua exposição ao risco.",
  "Ponto de atenção: responsabilidade coletiva não elimina a responsabilidade individual; as duas se complementam."
 ],
 ["Aprendizagem Contínua",
  "Aprendizagem contínua transforma experiências em melhoria. Envolve revisar hábitos, reconhecer erros, acompanhar mudanças tecnológicas e normativas, buscar informação confiável e testar novas estratégias com segurança. A formação não termina quando uma pessoa recebe uma habilitação ou certificado.",
  "Crie um diário de aprendizagem com três situações recentes: o que ocorreu, o que você percebeu, o que poderia fazer diferente e qual conhecimento precisa desenvolver.",
  "Quando termina a formação para uma mobilidade segura?",
  "Ela não termina; deve acompanhar novas experiências, contextos, tecnologias e conhecimentos.",
  "Experiência por si só não garante aprendizagem: é possível repetir erros durante anos. Para que uma experiência se transforme em competência, é necessário observar, refletir, receber feedback, ajustar comportamento e verificar novamente. A aprendizagem também deve incluir atualização de fontes e reconhecimento dos próprios limites.",
  "Projeto pessoal: escolha uma competência do NEXUS 12, defina uma prática semanal e um indicador simples de progresso por quatro semanas.",
  "Ponto de atenção: aprendizagem contínua não significa buscar informação indiscriminadamente; priorize fontes confiáveis e relevantes."
 ],
 ["Ergonomia e Conforto",
  "Ergonomia relaciona pessoa, tarefa, veículo e ambiente. Postura, ajuste de banco e volante, visibilidade, temperatura, ruído, vibração, pausas e fadiga podem alterar atenção, conforto e capacidade de resposta. Conforto, nesse contexto, é uma variável funcional da segurança.",
  "Faça um checklist de preparação antes de uma viagem longa: postura, espelhos, alcance dos comandos, visibilidade, temperatura, hidratação, pausas e condições físicas. Identifique quais fatores poderiam degradar sua capacidade ao longo do percurso.",
  "Por que ergonomia pertence à segurança?",
  "Porque condições físicas, fadiga e postura influenciam atenção, decisão e controle.",
  "A fadiga reduz desempenho cognitivo e pode prejudicar percepção e tomada de decisão. Ajustes inadequados aumentam desconforto e distração. Ergonomia também envolve acessibilidade e desenho dos ambientes de mobilidade. A prevenção deve ocorrer antes de a degradação funcional se tornar evidente.",
  "Estudo de caso: planeje uma viagem longa incluindo pausas, ajuste do posto de condução e critérios para interromper a atividade se as condições físicas se deteriorarem.",
  "Ponto de atenção: nenhum ajuste ergonômico substitui descanso adequado quando existe fadiga significativa."
 ],
 ["Primeiros Socorros e Reação a Acidentes",
  "Em um acidente, a prioridade inicial é preservar a vida sem criar novas vítimas. A resposta segura envolve proteger a cena quando possível, avaliar riscos imediatos, acionar recursos especializados, comunicar localização e informações relevantes e evitar procedimentos para os quais não exista treinamento.",
  "Em um cenário hipotético de acidente, organize uma sequência de resposta que priorize segurança da cena, acionamento do atendimento e comunicação. Não pratique procedimentos invasivos sem treinamento adequado.",
  "Qual é uma prioridade inicial diante de um acidente?",
  "Proteger a cena e acionar recursos adequados, evitando agravar lesões.",
  "A resposta a acidentes exige autocontrole e reconhecimento de limites. Aproximar-se de uma cena com fogo, tráfego ativo, eletricidade ou outros perigos pode gerar novas vítimas. A comunicação clara com serviços de emergência deve incluir localização, número aproximado de envolvidos, riscos presentes e necessidades aparentes, sem inventar informações.",
  "Exercício: para um cenário fictício, escreva quais riscos devem ser identificados, quais serviços devem ser acionados e quais ações você deliberadamente não faria sem treinamento.",
  "Ponto de atenção: primeiros socorros exigem formação adequada; quando houver dúvida, priorize segurança e orientação dos serviços de emergência."
 ]
];

n>';
