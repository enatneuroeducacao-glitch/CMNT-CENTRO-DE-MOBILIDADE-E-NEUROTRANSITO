<body>
<div id="app"><div style="min-height:100vh;display:grid;place-items:center;background:#f4f7fa;font-family:system-ui,sans-serif"><div style="text-align:center;padding:30px"><div style="font-size:28px;font-weight:900;color:#07111f">ENAT</div><div style="margin-top:10px;color:#64748b">Carregando a rede social...</div></div></div></div><div id="modal"></div><div id="toast" class="fixed right-4 bottom-20 md:bottom-5 z-[90] space-y-2"></div>
<script>
const SUPABASE_URL='https://gicjsuagmiyoqvttbqjw.supabase.co';
const KEY='sb_publishable_ovAAaIT0nXzSMiy2KYGHTw_ydsshEzK';
let db=null;function bootError(e){var a=document.getElementById('app');if(a)a.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#f4f7fa;font-family:system-ui,sans-serif;padding:24px"><div style="max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 10px 35px rgba(7,17,31,.08)"><div style="font-size:28px;font-weight:900;color:#07111f">ENAT</div><h1 style="font-size:22px;margin:16px 0 8px">Não foi possível iniciar a aplicação</h1><p style="color:#64748b;line-height:1.6">A página foi publicada, mas ocorreu um erro ao iniciar a conexão da aplicação. O sistema identificou o problema e pode ser corrigido sem perder os dados.</p><pre style="white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:14px;color:#991b1b;font-size:12px">'+esc(e&&e.message?e.message:String(e))+'</pre><button onclick="location.reload()" style="margin-top:12px;background:#07111f;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700">Tentar novamente</button></div></div>';}try{if(!window.supabase||!window.supabase.createClient)throw new Error('Biblioteca Supabase não carregou.');db=window.supabase.createClient(SUPABASE_URL,KEY);}catch(e){bootError(e);}
const S={tab:'home',user:null,profile:null,posts:[],communities:[],notes:[],following:new Set(),saved:new Set(),likes:new Set(),stats:{},search:''};

function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function av(p){return p&&p.avatar_url?p.avatar_url:'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent((p&&p.display_name)||'ENAT')}
function ago(d){var n=(Date.now()-new Date(d).getTime())/1000;if(n<60)return'agora';if(n<3600)return Math.floor(n/60)+' min';if(n<86400)return Math.floor(n/3600)+' h';if(n<604800)return Math.floor(n/86400)+' d';return new Date(d).toLocaleDateString('pt-BR')}
function toast(t,err){var x=document.createElement('div');x.className='px-4 py-3 rounded-2xl text-sm font-bold shadow-xl '+(err?'bg-red-600 text-white':'bg-[#07111f] text-white');x.textContent=t;document.getElementById('toast').appendChild(x);setTimeout(function(){x.remove()},3000)}
function closeModal(){document.getElementById('modal').innerHTML=''}
function svg(n){var d={home:'M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5v-9Z',search:'m21 21-4.4-4.4M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',user:'M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',heart:'M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z',comment:'M20 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-4.2-1.1L3 20l1.6-4.5A8 8 0 1 1 20 11.5Z',bookmark:'M6 3h12v18l-6-4-6 4V3Z',share:'M12 3v12m0-12 5 5m-5-5L7 8M5 13v6h14v-6',message:'M21 11.5a8 8 0 0 1-8 8 8.7 8.7 0 0 1-4.2-1.1L4 20l1.6-4.5A8 8 0 1 1 21 11.5Z',shield:'M12 3 20 6v5c0 5.5-3.4 9-8 10-4.6-1-8-4.5-8-10V6l8-3Z',settings:'M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z'};return'<svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="'+(d[n]||d.home)+'"/></svg>'}

function nav(){var a=[['home','Início'],['search','Explorar'],['users','Comunidades'],['bell','Notificações'],['message','Mensagens'],['bookmark','Salvos'],['user','Perfil'],['settings','Configurações']];return a.map(function(x){return'<button onclick="go(\''+x[0]+'\')" class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl text-sm font-bold '+(S.tab===x[0]?'active':'text-slate-600 hover:bg-slate-50')+'">'+svg(x[0])+'<span>'+x[1]+'</span></button>'}).join('')}
function header(){return'<header class="sticky top-0 z-50 glass border-b border-slate-200"><div class="max-w-7xl mx-auto h-16 px-3 sm:px-5 flex items-center gap-3"><button onclick="go(\'home\')" class="flex items-center gap-2"><span class="w-10 h-10 rounded-2xl overflow-hidden bg-[#07111f] border border-slate-200 grid place-items-center"><span class="text-[10px] leading-none font-black tracking-tight text-white">ENAT<br><span class="text-[7px] text-emerald-300">CMNT</span></span></span><span class="hidden sm:block text-xl font-black">ENAT</span></button><div class="hidden md:block flex-1 max-w-lg relative ml-5"><input value="'+esc(S.search)+'" onkeydown="if(event.key===\'Enter\'){S.search=this.value;loadPosts().then(render)}" class="w-full bg-slate-100 rounded-2xl py-2.5 pl-4 pr-4 outline-none" placeholder="Pesquisar trânsito, pessoas e comunidades"></div><div class="ml-auto flex items-center gap-2">'+(S.user?'<button onclick="go(\'notifications\')" class="p-2.5 rounded-xl hover:bg-slate-100">'+svg('bell')+'</button><button onclick="go(\'profile\')" class="flex items-center gap-2 p-1 rounded-2xl"><img src="'+av(S.profile)+'" class="w-9 h-9 rounded-xl"><span class="hidden lg:block text-sm font-bold">'+esc(S.profile.display_name)+'</span></button>':'<button onclick="auth()" class="px-4 py-2.5 bg-[#07111f] text-white rounded-xl font-bold text-sm">Entrar</button>')+'</div></div></header>'}
function rail(){return'<aside class="hidden md:block sticky top-20 h-fit space-y-4"><div class="card rounded-3xl p-5"><div class="flex justify-between items-center"><b>Comunidades</b><button onclick="go(\'users\')" class="text-xs text-[#0b8b55] font-bold">Ver todas</button></div><div class="mt-4 space-y-4">'+S.communities.slice(0,5).map(function(c){return'<button onclick="community(\''+c.id+'\')" class="w-full text-left flex gap-3"><span class="w-10 h-10 rounded-xl brand text-white grid place-items-center font-black">'+esc(c.name).slice(0,2).toUpperCase()+'</span><span><b class="block text-sm">'+esc(c.name)+'</b><small class="text-slate-500">'+esc(c.category)+'</small></span></button>'}).join('')+'</div></div><div class="card rounded-3xl p-5"><b>Manifesto</b><p class="text-sm text-slate-600 mt-2 leading-6">Segurança antes do engajamento. Informação antes do ruído. Pessoas antes dos veículos.</p></div></aside>'}
function shell(){document.getElementById('app').innerHTML=header()+'<div class="max-w-7xl mx-auto grid md:grid-cols-[220px_minmax(0,1fr)_300px] gap-6 px-3 sm:px-5 py-5"><aside class="hidden md:block sticky top-20 h-fit"><div class="card rounded-3xl p-3">'+nav()+'</div><div class="brand text-white rounded-3xl p-5 mt-4"><small class="uppercase tracking-widest text-emerald-300 font-black">ENAT</small><h3 class="font-black text-lg mt-1">Rede social de trânsito</h3><p class="text-white/70 text-sm mt-2">Conectando conhecimento, comportamento e mobilidade.</p></div></aside><main id="main" class="min-w-0"></main>'+rail()+'</div><nav class="md:hidden fixed bottom-0 inset-x-0 z-50 glass border-t px-2 pb-[env(safe-area-inset-bottom)]"><div class="grid grid-cols-5 py-2">'+[['home','Início'],['search','Explorar'],['plus','Criar'],['users','Grupos'],['user','Perfil']].map(function(x){return'<button onclick="go(\''+(x[0]==='plus'?'create':x[0]==='users'?'users':x[0])+'\')" class="flex flex-col items-center gap-1 text-xs '+(S.tab===x[0]?'text-[#0b8b55]':'text-slate-500')+'">'+(x[0]==='plus'?'<span class="w-8 h-8 rounded-xl bg-[#07111f] text-white grid place-items-center text-xl">+</span>':svg(x[0]))+x[1]+'</button>'}).join('')+'</div></nav>';render()}
function composer(){return'<div class="card rounded-3xl p-4"><div class="flex gap-3"><img src="'+av(S.profile)+'" class="w-11 h-11 rounded-2xl"><button onclick="createPost()" class="flex-1 text-left bg-slate-100 text-slate-500 rounded-2xl px-4">O que está acontecendo no trânsito?</button></div><div class="flex justify-between mt-3 pt-3 border-t text-sm"><button onclick="createPost()" class="font-bold text-slate-600">▧ Foto</button><button onclick="createPost()" class="font-bold text-slate-600">▶ Vídeo</button><button onclick="createPost()" class="font-bold text-amber-600">⚠ Alerta</button><button onclick="createPost()" class="font-bold text-[#0b8b55]">Publicar</button></div></div>'}
async function like(id){if(!S.user)return auth();var has=S.likes.has(id);if(has){var d=await db.from('social_reactions').delete().eq('post_id',id).eq('user_id',S.user.id).eq('reaction','like');if(d.error)return toast('Não foi possível retirar a curtida.',true);S.likes.delete(id)}else{var d=await db.from('social_reactions').insert({post_id:id,user_id:S.user.id,reaction:'like'});if(d.error)return toast('Não foi possível curtir.',true);S.likes.add(id)}await loadPosts();render()}
async function bookmark(id){if(!S.user)return auth();var has=S.saved.has(id);if(has){var d=await db.from('social_bookmarks').delete().eq('post_id',id).eq('user_id',S.user.id);if(d.error)return toast('Não foi possível remover dos salvos.',true);S.saved.delete(id);toast('Publicação removida dos salvos.')}else{var d=await db.from('social_bookmarks').insert({post_id:id,user_id:S.user.id});if(d.error)return toast('Não foi possível salvar.',true);S.saved.add(id);toast('Publicação salva.')}await loadPosts();render()}
async function share(id){if(!S.user)return auth();var d=await db.from('social_post_shares').upsert({post_id:id,user_id:S.user.id},{onConflict:'post_id,user_id'});if(d.error)return toast('Não foi possível registrar o compartilhamento.',true);await loadPosts();render();var url=location.origin+location.pathname+'?post='+encodeURIComponent(id);try{if(navigator.share){await navigator.share({title:'CMNT — publicação',url:url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('Link copiado para a área de transferência.')}else{window.prompt('Copie o link da publicação:',url)}}catch(e){if(e&&e.name!=='AbortError')toast('Não foi possível compartilhar.',true)}}
async function comments(id){
 if(!S.user)return auth();
 var r=await db.from('social_comments').select('id,author_id,content,created_at').eq('post_id',id).order('created_at',{ascending:true});
 if(r.error)return toast('Não foi possível carregar os comentários.',true);
 var ids=[...new Set((r.data||[]).map(function(x){return x.author_id}).filter(Boolean))];
 var profiles={};
 if(ids.length){var pr=await db.from('social_profiles').select('id,display_name,username,avatar_url').in('id',ids);(pr.data||[]).forEach(function(x){profiles[x.id]=x})}
 var items=(r.data||[]).map(function(x){
   var p=profiles[x.author_id]||{};
   var mine=x.author_id===S.user.id;
   var actions=mine?'<div class="flex gap-2 mt-2"><button type="button" onclick="editComment(\''+x.id+'\',\''+id+'\')" class="text-xs font-bold text-[#0b8b55]">Editar</button><button type="button" onclick="deleteComment(\''+x.id+'\',\''+id+'\')" class="text-xs font-bold text-red-500">Excluir</button></div>':'';
   return '<div class="py-3 border-b border-slate-100"><div class="flex gap-3"><img src="'+av(p)+'" class="w-9 h-9 rounded-xl"><div class="min-w-0 flex-1"><div class="font-bold text-sm">'+esc(p.display_name||'Usuário')+' <span class="font-normal text-slate-400">@'+esc(p.username||'usuario')+'</span></div><div class="text-sm mt-1 whitespace-pre-wrap" id="comment-body-'+x.id+'">'+esc(x.content)+'</div>'+actions+'</div></div></div>'
 }).join('')||'<div class="py-8 text-center text-slate-400">Ainda não há comentários.</div>';
 document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-3xl p-5 w-full max-w-xl max-h-[85vh] flex flex-col"><div class="flex items-center justify-between"><h2 class="text-xl font-black">Comentários</h2><button type="button" onclick="closeModal()" class="w-10 h-10 rounded-xl hover:bg-slate-100 text-2xl text-slate-500">×</button></div><div class="overflow-auto mt-3">'+items+'</div><div class="flex gap-2 pt-3 mt-2 border-t"><input id="commentText" class="flex-1 bg-slate-100 rounded-xl px-4 py-3" placeholder="Escreva um comentário..." onkeydown="if(event.key===\'Enter\')addComment(\''+id+'\')"><button type="button" onclick="addComment(\''+id+'\')" class="bg-[#0b8b55] text-white px-5 rounded-xl font-bold">Enviar</button></div></div></div>';
}
async function editComment(commentId,postId){
 var body=document.getElementById('comment-body-'+commentId);if(!body)return;
 var current=body.textContent||'';var value=window.prompt('Edite seu comentário:',current);if(value===null)return;value=value.trim();if(!value)return toast('O comentário não pode ficar vazio.',true);
 var r=await db.from('social_comments').update({content:value}).eq('id',commentId).eq('author_id',S.user.id);if(r.error)return toast('Não foi possível editar o comentário.',true);await comments(postId)
}
async function deleteComment(commentId,postId){
 if(!window.confirm('Excluir este comentário?'))return;
 var r=await db.from('social_comments').delete().eq('id',commentId).eq('author_id',S.user.id);if(r.error)return toast('Não foi possível excluir o comentário.',true);
 if(S.stats[postId])S.stats[postId].comments_count=Math.max(0,Number(S.stats[postId].comments_count||0)-1);
 await comments(postId);render()
}
async function addComment(id){
 var el=document.getElementById('commentText');var content=(el&&el.value||'').trim();if(!content)return;
 var r=await db.from('social_comments').insert({post_id:id,author_id:S.user.id,content:content});if(r.error)return toast('Não foi possível comentar.',true);
 S.stats[id]=S.stats[id]||{};S.stats[id].comments_count=Number(S.stats[id].comments_count||0)+1;await comments(id)
}
function report(id){if(!S.user)return auth();document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-3xl p-6 w-full max-w-md"><div class="flex items-center justify-between"><h2 class="text-xl font-black">Denunciar publicação</h2><button type="button" onclick="closeModal()" class="w-10 h-10 rounded-xl hover:bg-slate-100 text-2xl text-slate-500">×</button></div><p class="text-sm text-slate-500 mt-2">Ajude a manter o CMNT seguro. Escolha o motivo:</p><div class="grid gap-2 mt-4">'+[['spam','Spam ou conteúdo repetitivo'],['harassment','Assédio ou ataque pessoal'],['misinformation','Informação potencialmente enganosa'],['violence','Violência ou ameaça'],['other','Outro motivo']].map(function(x){return'<button type="button" onclick="submitReport(\''+id+'\',\''+x[0]+'\')" class="text-left px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 font-bold">'+x[1]+'</button>'}).join('')+'</div></div></div>'}
async function submitReport(id,reason){var r=await db.from('social_reports').insert({reporter_id:S.user.id,post_id:id,reason:reason,status:'open'});if(r.error)return toast('Não foi possível registrar a denúncia.',true);closeModal();toast('Denúncia registrada. Obrigado por ajudar a manter a comunidade segura.')}
function post(p){var prof=p.social_profiles||{},like=S.likes.has(p.id),save=S.saved.has(p.id),st=S.stats[p.id]||{};return'<article class="card rounded-3xl p-4 sm:p-5"><div class="flex gap-3"><img src="'+av(prof)+'" class="w-11 h-11 rounded-2xl"><div class="flex-1 min-w-0"><button onclick="openProfile(\''+p.author_id+'\')" class="font-black">'+esc(prof.display_name||'Usuário')+'</button><div class="text-xs text-slate-500">@'+esc(prof.username||'usuario')+' · '+ago(p.created_at)+(p.location?' · '+esc(p.location):'')+'</div></div><button onclick="report(\''+p.id+'\')" class="text-slate-400">•••</button></div><div class="mt-4 whitespace-pre-wrap leading-7">'+esc(p.content).replace(/#([\wÀ-ÿ-]+)/g,'<b class="text-[#0b8b55]">#$1</b>')+'</div>'+(p.media_url?'<div class="mt-4 rounded-2xl overflow-hidden bg-slate-100">'+(p.media_type==='video'?'<video controls class="w-full max-h-[520px]" src="'+esc(p.media_url)+'"></video>':'<img class="w-full max-h-[520px] object-cover" src="'+esc(p.media_url)+'">')+'</div>':'')+'<div class="flex items-center gap-5 mt-4 pt-3 border-t text-slate-500 text-sm"><button onclick="like(\''+p.id+'\')" class="'+(like?'text-red-500':'')+' flex gap-1.5 items-center">'+svg('heart')+'Curtir <span class="font-bold">'+Number(st.likes_count||0)+'</span></button><button onclick="comments(\''+p.id+'\')" class="flex gap-1.5 items-center">'+svg('comment')+'Comentar <span class="font-bold">'+Number(st.comments_count||0)+'</span></button><button onclick="share(\''+p.id+'\')" class="flex gap-1.5 items-center">'+svg('share')+'Compartilhar <span class="font-bold">'+Number(st.shares_count||0)+'</span></button><button onclick="bookmark(\''+p.id+'\')" aria-label="Salvar" class="'+(save?'text-[#0b8b55]':'')+' flex gap-1.5 items-center">'+svg('bookmark')+'<span class="font-bold">'+Number(st.bookmarks_count||0)+'</span></button></div></article>'}
function home(){return'<section><div class="brand text-white rounded-3xl p-6 sm:p-8 mb-5"><small class="uppercase tracking-[.2em] font-black text-emerald-300">ENAT • mobilidade • segurança</small><h1 class="text-3xl sm:text-4xl font-black mt-2">Uma rede social feita para quem vive o trânsito.</h1><p class="mt-3 text-white/75 max-w-2xl">Motoristas, motociclistas, ciclistas, pedestres, instrutores, pesquisadores, gestores e comunidades no mesmo espaço.</p></div>'+composer()+'<div id="feed" class="space-y-4 mt-5"></div></section>'}

async function openProfile(id){
  if(!id)return;
  try{
    var r=await db.from('social_profiles').select('*').eq('id',id).maybeSingle();
    if(r.error)throw new Error(r.error.message);
    if(!r.data){toast('Perfil não encontrado.',true);return}
    var p=r.data, isMe=S.user&&S.user.id===id, following=!isMe&&S.following.has(id);
    var fc=await db.from('social_follows').select('*',{count:'exact',head:true}).eq('following_id',id);
    var fg=await db.from('social_follows').select('*',{count:'exact',head:true}).eq('follower_id',id);
    var followers=fc.count||0, followingCount=fg.count||0;
    var cover=p.cover_url?'<img src="'+esc(p.cover_url)+'" class="w-full h-32 object-cover">':'<div class="h-32 brand"></div>';
    document.getElementById('modal').innerHTML='<div class="fixed inset-0 z-[80] modal grid place-items-center p-4" onclick="if(event.target===this)closeModal()"><div class="bg-white w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl">'+cover+'<div class="p-5"><div class="-mt-14 flex items-end justify-between"><img src="'+av(p)+'" class="w-24 h-24 rounded-3xl border-4 border-white object-cover"><div class="flex gap-2">'+(isMe?'<button onclick="go(\'profile\');closeModal()" class="px-4 py-2.5 bg-slate-100 rounded-xl font-bold">Meu perfil</button>':'<button id="followProfileBtn" onclick="toggleFollow(\''+id+'\')" class="px-5 py-2.5 '+(following?'bg-slate-100 text-slate-700':'bg-[#07111f] text-white')+' rounded-xl font-bold">'+(following?'Seguindo':'Seguir')+'</button>')+'</div></div><h2 class="text-2xl font-black mt-3">'+esc(p.display_name||'Usuário')+'</h2><div class="text-sm text-slate-500">@'+esc(p.username||'usuario')+(p.city?' · '+esc(p.city)+'/'+esc(p.state||''):'')+'</div><p class="mt-3 whitespace-pre-wrap">'+esc(p.bio||'')+'</p><div class="flex gap-6 mt-4 text-sm"><b>'+followers+' <span class="font-normal">seguidores</span></b><b>'+followingCount+' <span class="font-normal">seguindo</span></b></div></div></div></div>';
  }catch(e){toast('Não foi possível abrir o perfil: '+(e.message||e),true)}
}
async function toggleFollow(id){
  if(!S.user){auth();return}
  if(S.user.id===id)return;
  var btn=document.getElementById('followProfileBtn');
  if(btn){btn.disabled=true}
  try{
    var isFollowing=S.following.has(id);
    if(isFollowing){
      var d=await db.from('social_follows').delete().eq('follower_id',S.user.id).eq('following_id',id);
      if(d.error)throw new Error(d.error.message);
      S.following.delete(id);
      toast('Você deixou de seguir este perfil.');
    }else{
      var i=await db.from('social_follows').insert({follower_id:S.user.id,following_id:id});
      if(i.error)throw new Error(i.error.message);
      S.following.add(id);
      toast('Agora você está seguindo este perfil.');
      await db.from('social_notifications').insert({user_id:id,type:'follow',message:(S.profile.display_name||'Alguém')+' começou a seguir você.'});
    }
    var p=await db.from('social_profiles').select('*').eq('id',id).maybeSingle();
    if(p.data){var fc=await db.from('social_follows').select('*',{count:'exact',head:true}).eq('following_id',id);var fg=await db.from('social_follows').select('*',{count:'exact',head:true}).eq('follower_id',id);var f=S.following.has(id);var b=document.getElementById('followProfileBtn');if(b){b.disabled=false;b.textContent=f?'Seguindo':'Seguir';b.className='px-5 py-2.5 '+(f?'bg-slate-100 text-slate-700':'bg-[#07111f] text-white')+' rounded-xl font-bold'}}
  }catch(e){if(btn)btn.disabled=false;toast('Não foi possível alterar o seguimento: '+(e.message||e),true)}
}

async function loadPosts(){var q=db.from('social_posts').select('id,author_id,content,media_url,media_type,location,visibility,created_at').eq('visibility','public').order('created_at',{ascending:false}).limit(60);if(S.search)q=q.ilike('content','%'+S.search.replace(/[%_]/g,'')+'%');var r=await q;if(r.error){toast('Feed: '+r.error.message,true);S.posts=[];return}S.posts=r.data||[];var ids=[...new Set(S.posts.map(function(p){return p.author_id}).filter(Boolean))];if(ids.length){var pr=await db.from('social_profiles').select('id,username,display_name,avatar_url,city,state,verified').in('id',ids);var map={};(pr.data||[]).forEach(function(x){map[x.id]=x});S.posts.forEach(function(p){p.social_profiles=map[p.author_id]||{display_name:'Usuário',username:'usuario'}})}var stats=await db.from('social_post_stats').select('post_id,likes_count,comments_count,shares_count,bookmarks_count').in('post_id',S.posts.map(function(p){return p.id}));S.stats={};(stats.data||[]).forEach(function(x){S.stats[x.post_id]=x});if(S.user){var l=await db.from('social_reactions').select('post_id').eq('user_id',S.user.id);S.likes=new Set((l.data||[]).map(function(x){return x.post_id}));var b=await db.from('social_bookmarks').select('post_id').eq('user_id',S.user.id);S.saved=new Set((b.data||[]).map(function(x){return x.post_id}))}}
async function load(){var c=await db.from('social_communities').select('*').order('name');S.communities=c.data||[];if(S.user){var n=await db.from('social_notifications').select('*').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(30);S.notes=n.data||[]}await loadPosts()}
function auth(){document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4 overflow-auto"><div class="bg-white rounded-3xl p-6 w-full max-w-xl my-6"><div class="text-xs uppercase tracking-widest text-[#0b8b55] font-black">ENAT</div><h2 id="at" class="text-2xl font-black mt-1">Entrar</h2><p id="asub" class="text-sm text-slate-500 mt-1">Acesso à rede social.</p><div class="space-y-3 mt-5"><input id="an" class="w-full p-3 bg-slate-100 rounded-xl hide" placeholder="Nome completo"><div id="registerFields" class="hide space-y-3"><div class="grid sm:grid-cols-2 gap-3"><input id="acity" class="w-full p-3 bg-slate-100 rounded-xl" placeholder="Cidade *"><input id="astate" maxlength="2" class="w-full p-3 bg-slate-100 rounded-xl uppercase" placeholder="Estado (UF) *"></div><div class="grid sm:grid-cols-2 gap-3"><label class="block"><span class="text-xs font-bold text-slate-500">Data de nascimento *</span><input id="abirth" type="date" class="w-full p-3 bg-slate-100 rounded-xl mt-1"></label><label class="block"><span class="text-xs font-bold text-slate-500">Tipo de credencial *</span><select id="acredType" class="w-full p-3 bg-slate-100 rounded-xl mt-1"><option value="">Selecione</option><option>CNH</option><option>Instrutor de Trânsito</option><option>Profissional de mobilidade</option><option>Pesquisador</option><option>Gestor público</option><option>Usuário da comunidade</option><option>Outra</option></select></label></div><input id="acred" class="w-full p-3 bg-slate-100 rounded-xl" placeholder="Número da credencial *"><div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm text-slate-600 leading-6"><b class="text-slate-800">Compromisso ENAT:</b> respeito, civilidade e responsabilidade. Não serão tolerados assédio, ameaças, discriminação, humilhação, exposição indevida, violência ou conteúdo que coloque outras pessoas em risco.</div><label class="flex gap-3 items-start text-sm"><input id="arespect" type="chec var reg=false;function toggleAuth(){reg=!reg;document.getElementById('at').textContent=reg?'Criar conta':'Entrar';document.getElementById('asub').textContent=reg?'Cadastro com identificação básica, localização e compromisso de convivência segura.':'Acesso à rede social.';document.getElementById('an').classList.toggle('hide',!reg);document.getElementById('registerFields').classList.toggle('hide',!reg);document.getElementById('ab').textContent=reg?'Cadastrar':'Entrar';document.getElementById('ab').onclick=function(){doAuth(reg)}}
function privacyPolicy(){document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[80] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-2xl max-h-[90vh] overflow-auto"><div class="flex justify-between items-center"><h2 class="text-2xl font-black">Aviso de Privacidade — ENAT</h2><button onclick="auth();if(reg)toggleAuth()" class="text-2xl text-slate-400">×</button></div><div class="text-sm text-slate-600 leading-7 mt-5 space-y-4"><p>O ENAT coleta dados necessários para criar e proteger a conta, permitir a participação na comunidade e cumprir obrigações aplicáveis. Entre eles podem estar nome, e-mail, cidade, estado, data de nascimento e informações de credencial fornecidas no cadastro.</p><p>Dados de nascimento e credencial são tratados como informações de cadastro e <b>não são exibidos publicamente no perfil</b>. Cidade e estado podem aparecer no perfil conforme as configurações da plataforma.</p><p>O titular pode solicitar informações, acesso, correção, eliminação quando aplicável, revogação de consentimento e outros direitos previstos na LGPD, pelos canais disponibilizados pela plataforma.</p><p>O ENAT adotará medidas de segurança e limitará o uso dos dados às finalidades informadas. A política deverá ser atualizada quando houver mudança relevante no tratamento.</p><p><b>Versão do aviso: 1.0</b></p></div><button onclick="auth();if(reg)toggleAuth()" class="w-full mt-5 bg-[#07111f] text-white rounded-2xl p-3 font-black">Voltar ao cadastro</button></div></div>'}
async function doAuth(sign){var e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value,n=document.getElementById('an').value.trim();if(p.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.',true);if(sign){var city=document.getElementById('acity').value.trim(),state=document.getElementById('astate').value.trim().toUpperCase(),birth=document.getElementById('abirth').value,credType=document.getElementById('acredType').value,cred=document.getElementById('acred').value.trim(),respect=document.getElementById('arespect').checked,lgpd=document.getElementById('algpd').checked;if(!n||!city||state.length!==2||!birth||!credType||!cred)return toast('Preencha todos os campos obrigatórios do cadastro.',true);if(!respect)return toast('Você precisa aceitar o Compromisso de Respeito e Convivência.',true);if(!lgpd)return toast('É necessário ler e aceitar o Aviso de Privacidade/LGPD.',true);var bd=new Date(birth+'T00:00:00');var now=new Date();var age=now.getFullYear()-bd.getFullYear();if(now.getMonth()<bd.getMonth()||(now.getMonth()===bd.getMonth()&&now.getDate()<bd.getDate()))age--;if(age<18)return toast('O cadastro inicial do ENAT é destinado a maiores de 18 anos.',true);if(bd>now)return toast('Data de nascimento inválida.',true);var username=(n||e.split('@')[0]).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9_]/g,'');var meta={display_name:n,username:username,birth_date:birth,credential_type:credType,credential_number:cred,lgpd_consent:true,community_guidelines_accepted:true,privacy_policy_version:'1.0',city:city,state:state};var r=await db.auth.signUp({email:e,password:p,options:{data:meta}});if(r.error)return toast(r.error.message,true);if(r.data&&r.data.user){await db.from('social_profiles').update({display_name:n,city:city,state:state,updated_at:new Date().toISOString()}).eq('id',r.data.user.id)}toast(r.data.session?'Cadastro concluído.':'Cadastro criado. Verifique seu e-mail para ativar a conta.');closeModal();if(r.data.session)await init()}else{var r=await db.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message,true);closeModal();await init()}}
async function logout(){await db.auth.signOut();await init()}
function createPost(){if(!S.user)return auth();document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-xl"><div class="flex justify-between"><h2 class="text-2xl font-black">Nova publicação</h2><button onclick="closeModal()" class="text-2xl text-slate-400">×</button></div><textarea id="pc" rows="7" class="w-full bg-slate-100 rounded-2xl p-4 mt-5" placeholder="Compartilhe uma experiência, notícia ou solução sobre trânsito..."></textarea><label class="mt-3 flex items-center justify-between gap-3 bg-slate-100 rounded-2xl p-4 cursor-pointer"><span><b class="block">Anexar imagem ou vídeo</b><small id="pfileName" class="text-slate-500">JPG, PNG, WEBP, GIF, MP4, WEBM ou MOV · até 50 MB</small></span><span class="shrink-0 bg-white border border-slate-200 px-4 py-2 rounded-xl font-bold">Escolher arquivo</span><input id="pfile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" class="hidden" onchange="previewAttachment(this)"></label><div id="pfilePreview" class="hidden mt-3 rounded-2xl overflow-hidden bg-slate-100"></div><input id="pl" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Local (opcional)"><button onclick="publish()" class="w-full bg-[#0b8b55] text-white rounded-2xl p-3 mt-4 font-black">Publicar</button></div></div>'}
function previewAttachment(input){var f=input.files&&input.files[0],n=document.getElementById('pfileName'),p=document.getElementById('pfilePreview');if(!f)return;n.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB';if(f.size>52428800){n.textContent='Arquivo acima do limite de 50 MB';input.value='';p.classList.add('hidden');return}var u=window.URL.createObjectURL(f);p.classList.remove('hidden');p.innerHTML=f.type.indexOf('video/')===0?'<video controls class="w-full max-h-80" src="'+u+'"></video>':'<img class="w-full max-h-80 object-cover" src="'+u+'">'}
async function publish(){var c=document.getElementById('pc').value.trim(),f=document.getElementById('pfile').files[0],l=document.getElementById('pl').value.trim();if(!c)return toast('Escreva o conteúdo.',true);if(f&&f.size>52428800)return toast('O arquivo deve ter no máximo 50 MB.',true);var media_url=null,media_type=null;if(f){var ok=['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm','video/quicktime'].includes(f.type);if(!ok)return toast('Formato de arquivo não permitido.',true);var ext=(f.name.split('.').pop()||'bin').toLowerCase();var path=S.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;var up=await db.storage.from('social-media').upload(path,f,{contentType:f.type,upsert:false});if(up.error)return toast('Não foi possível enviar o anexo: '+up.error.message,true);media_url=db.storage.from('social-media').getPublicUrl(path).data.publicUrl;media_type=f.type.indexOf('video/')===0?'video':'image'}var r=await db.from('social_posts').insert({author_id:S.user.id,content:c,media_url:media_url,media_type:media_type,location:l||null});if(r.error){if(f)await db.storage.from('social-media').remove([path]);return toast(r.error.message,true)}closeModal();await load();S.tab='home';shell();toast('Publicação criada.')}
function community(id){var c=S.communities.find(function(x){return x.id===id});if(!c)return;document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg"><div class="flex justify-between"><span class="text-xs uppercase tracking-widest text-[#0b8b55] font-black">'+esc(c.category)+'</span><button onclick="closeModal()" class="text-2xl">×</button></div><div class="w-16 h-16 brand text-white rounded-2xl grid place-items-center font-black text-xl mt-5">'+esc(c.name).slice(0,2).toUpperCase()+'</div><h2 class="text-2xl font-black mt-4">'+esc(c.name)+'</h2><p class="text-slate-600 mt-2">'+esc(c.description)+'</p>'+(S.user?'<button onclick="join(\''+id+'\')" class="w-full bg-[#0b8b55] text-white rounded-2xl p-3 mt-5 font-black">Participar</button>':'<button onclick="auth()" class="w-full bg-[#07111f] text-white rounded-2xl p-3 mt-5 font-black">Entrar para participar</button>')+'</div></div>'}
async function join(id){var r=await db.from('social_community_members').upsert({community_id:id,user_id:S.user.id});if(r.error)return toast(r.error.message,true);toast('Você entrou na comunidade.');closeModal()}
function newCommunity(){if(!S.user)return auth();document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4"><div class="bg-white rounded-3xl p-6 w-full max-w-lg"><h2 class="text-2xl font-black">Criar comunidade</h2><input id="cn" class="w-full bg-slate-100 rounded-xl p-3 mt-5" placeholder="Nome"><input id="ccat" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Categoria"><textarea id="cd" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Descrição"></textarea><button onclick="saveCommunity()" class="w-full bg-[#0b8b55] text-white rounded-xl p-3 mt-4 font-black">Criar</button></div></div>'}
async function saveCommunity(){var n=document.getElementById('cn').value.trim(),cat=document.getElementById('ccat').value.trim()||'Segurança Viária',d=document.getElementById('cd').value.trim();if(!n)return;var slug=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,6);var r=await db.from('social_communities').insert({name:n,slug:slug,description:d,category:cat,created_by:S.user.id});if(r.error)return toast(r.error.message,true);closeModal();await load();shell()}
function editProfile(){if(!S.user)return auth();var p=S.profile||{};document.getElementById('modal').innerHTML='<div class="fixed inset-0 modal z-[70] grid place-items-center p-4 overflow-auto"><div class="bg-white rounded-3xl p-6 w-full max-w-xl my-6"><div class="flex justify-between items-center"><div><h2 class="text-2xl font-black">Editar perfil</h2><p class="text-sm text-slate-500 mt-1">Atualize sua bio, foto de perfil e capa.</p></div><button onclick="closeModal()" class="text-2xl text-slate-400">×</button></div><div class="mt-5 rounded-2xl overflow-hidden bg-slate-100">'+(p.cover_url?'<img id="coverPreview" src="'+esc(p.cover_url)+'" class="w-full h-40 object-cover">':'<div id="coverPreview" class="w-full h-40 brand grid place-items-center text-white font-black">Capa do perfil</div>')+'</div><div class="grid sm:grid-cols-2 gap-3 mt-3"><label class="block cursor-pointer"><span class="text-xs font-bold text-slate-500">Imagem de capa</span><div class="mt-1 p-3 rounded-xl bg-slate-100 text-sm font-bold">Escolher imagem<input id="pcover" type="file" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="previewProfileImage(this,\'coverPreview\',true)"></div></label><label class="block cursor-pointer"><span class="text-xs font-bold text-slate-500">Foto de perfil</span><div class="mt-1 p-3 rounded-xl bg-slate-100 text-sm font-bold">Escolher imagem<input id="pavatar" type="file" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="previewProfileImage(this,\'avatarPreview\',false)"></div></label></div><div class="flex items-center gap-3 mt-4"><img id="avatarPreview" src="'+av(p)+'" class="w-20 h-20 rounded-2xl object-cover border-4 border-white shadow"><div class="text-xs text-slate-500">JPG, PNG ou WEBP · até 10 MB por imagem.</div></div><input id="pn" class="w-full bg-slate-100 rounded-xl p-3 mt-5" value="'+esc(p.display_name||'')+'" placeholder="Nome"><input id="pcity" class="w-full bg-slate-100 rounded-xl p-3 mt-3" value="'+esc(p.city||'')+'" placeholder="Cidade"><input id="pst" maxlength="2" class="w-full bg-slate-100 rounded-xl p-3 mt-3" value="'+esc(p.state||'')+'" placeholder="UF"><textarea id="pb" rows="5" class="w-full bg-slate-100 rounded-xl p-3 mt-3" placeholder="Bio">'+esc(p.bio||'')+'</textarea><button id="saveProfileBtn" onclick="saveProfile()" class="w-full bg-[#0b8b55] text-white rounded-xl p-3 mt-4 font-black">Salvar alterações</button></div></div>'}
function previewProfileImage(input,targetId,isCover){var f=input.files&&input.files[0],target=document.getElementById(targetId);if(!f||!target)return;if(f.size>10485760){input.value='';return toast('A imagem deve ter no máximo 10 MB.',true)}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){input.value='';return toast('Use JPG, PNG ou WEBP.',true)}var u=window.URL.createObjectURL(f);if(isCover){target.outerHTML='<img id="'+targetId+'" src="'+u+'" class="w-full h-40 object-cover">'}else{target.src=u}}
async function uploadProfileImage(file,kind){if(!file)return null;if(file.size>10485760)throw new Error('A imagem deve ter no máximo 10 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Use JPG, PNG ou WEBP.');var ext=(file.name.split('.').pop()||'jpg').toLowerCase();var path=S.user.id+'/profile/'+kind+'-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;var up=await db.storage.from('social-media').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw new Error(up.error.message);return db.storage.from('social-media').getPublicUrl(path).data.publicUrl}
function normalizeState(v){var s=(v||'').trim();var map={'ACRE':'AC','ALAGOAS':'AL','AMAPÁ':'AP','AMAPA':'AP','AMAZONAS':'AM','BAHIA':'BA','CEARÁ':'CE','CEARA':'CE','DISTRITO FEDERAL':'DF','ESPÍRITO SANTO':'ES','ESPIRITO SANTO':'ES','GOIÁS':'GO','GOIAS':'GO','MARANHÃO':'MA','MARANHAO':'MA','MATO GROSSO':'MT','MATO GROSSO DO SUL':'MS','MINAS GERAIS':'MG','PARÁ':'PA','PARA':'PA','PARAÍBA':'PB','PARAIBA':'PB','PARANÁ':'PR','PARANA':'PR','PERNAMBUCO':'PE','PIAUÍ':'PI','PIAUI':'PI','RIO DE JANEIRO':'RJ','RIO GRANDE DO NORTE':'RN','RIO GRANDE DO SUL':'RS','RONDÔNIA':'RO','RONDONIA':'RO','RORAIMA':'RR','SANTA CATARINA':'SC','SÃO PAULO':'SP','SAO PAULO':'SP','SERGIPE':'SE','TOCANTINS':'TO'};var key=s.toUpperCase();return map[key]||key}
function makeProfileUsername(name,email){var base=(name||((email||'usuario').split('@')[0])||'usuario').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]/g,'');if(!base)base='usuario';return base.slice(0,24)}
async function uniqueProfileUsername(name,email,id){var base=makeProfileUsername(name,email);var r=await db.from('social_profiles').select('id,username').ilike('username',base+'%');if(r.error)throw new Error(r.error.message);var used=new Set((r.data||[]).filter(function(x){return x.id!==id}).map(function(x){return String(x.username||'').toLowerCase()}));if(!used.has(base))return base;for(var n=2;n<10000;n++){var candidate=base.slice(0,Math.max(1,24-String(n).length))+n;if(!used.has(candidate))return candidate}return base+'_'+String(id||'').replace(/-/g,'').slice(0,5)}
async function ensureProfile(){if(!S.user)return null;var existing=await db.from('social_profiles').select('*').eq('id',S.user.id).maybeSingle();if(existing.error)throw new Error(existing.error.message);var meta=S.user.user_metadata||{};if(existing.data){var current=existing.data;var oldUsername=String(current.username||'');var base=makeProfileUsername(current.display_name||meta.display_name,S.user.email);var legacy=oldUsername.indexOf(base+'_')===0; if(legacy){var nu=await uniqueProfileUsername(current.display_name||meta.display_name,S.user.email,S.user.id);if(nu!==oldUsername){var up=await db.from('social_profiles').update({username:nu}).eq('id',S.user.id);if(up.error)throw new Error(up.error.message);current.username=nu}}return current}var username=await uniqueProfileUsername(meta.display_name,S.user.email,S.user.id);var payload={id:S.user.id,username:username,display_name:meta.display_name||((S.user.email||'usuario').split('@')[0]),avatar_url:'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(meta.display_name||'ENAT')};var created=await db.from('social_profiles').upsert(payload,{onConflict:'id'}).select('*').maybeSingle();if(created.error)throw new Error(created.error.message);return created.data}
async function saveProfile(){if(!S.user)return auth();var btn=document.getElementById('saveProfileBtn');if(btn){btn.disabled=true;btn.textContent='Salvando...'}try{var avatar=document.getElementById('pavatar').files[0],cover=document.getElementById('pcover').files[0];var avatarUrl=await uploadProfileImage(avatar,'avatar'),coverUrl=await uploadProfileImage(cover,'cover');var current=await ensureProfile();var payload={id:S.user.id,username:current&&current.username?current.username:makeProfileUsername(document.getElementById('pn').value,S.user.email,S.user.id),display_name:document.getElementById('pn').value.trim(),city:document.getElementById('pcity').value.trim(),state:normalizeState(document.getElementById('pst').value),bio:document.getElementById('pb').value.trim(),updated_at:new Date().toISOString()};if(!payload.display_name)throw new Error('Informe seu nome.');if(payload.state&&payload.state.length>2)throw new Error('Informe o estado por extenso ou pela sigla UF.');if(avatarUrl)payload.avatar_url=avatarUrl;if(coverUrl)payload.cover_url=coverUrl;var r=await db.from('social_profiles').upsert(payload,{onConflict:'id'}).select('*').maybeSingle();if(r.error)throw new Error(r.error.message);if(!r.data)throw new Error('Não foi possível criar ou localizar o perfil.');S.profile=r.data;closeModal();shell();toast('Perfil atualizado com sucesso.')}catch(e){if(btn){btn.disabled=false;btn.textContent='Salvar alterações'}toast('Não foi possível salvar o perfil: '+(e.message||e),true)}}
async function init(){if(!db)return;try{var s=await db.auth.getSession();S.user=s.data.session?s.data.session.user:null;if(S.user){S.profile=await ensureProfile();if(!S.profile)throw new Error('Não foi possível criar o perfil do usuário autenticado.');var f=await db.from('social_follows').select('following_id').eq('follower_id',S.user.id);S.following=new Set((f.data||[]).map(function(x){return x.following_id}))}else S.profile={display_name:'Visitante',username:'visitante'};await load();shell()}catch(e){console.error(e);bootError(e)}}
if(db){db.auth.onAuthStateChange(function(){setTimeout(init,0)});init()}
</script>
